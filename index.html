<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root { --bg:#0a0a0a; --fg:#f0f0f0; --gray:#666; --accent:#c8ff00; --border:#1f1f1f; }
  body { background:var(--bg); color:var(--fg); font-family:'Helvetica Neue',Arial,sans-serif; min-height:100vh; padding:40px 20px; }
  header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:24px; margin-bottom:40px; }
  .logo { font-size:13px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  .subtitle { font-size:11px; color:var(--gray); letter-spacing:.1em; text-transform:uppercase; }

  .upload-zone { display:block; border:1px dashed #2a2a2a; border-radius:4px; padding:56px 40px; text-align:center; cursor:pointer; transition:border-color .2s; max-width:640px; margin:0 auto 32px; }
  .upload-zone:hover { border-color:var(--accent); }
  .upload-zone.drag-over { border-color:var(--accent); background:rgba(200,255,0,.03); }
  #file-input { display:none; }
  .upload-icon { font-size:28px; margin-bottom:14px; opacity:.35; }
  .upload-label { font-size:13px; color:var(--gray); letter-spacing:.05em; }
  .upload-hint { font-size:11px; color:#404040; margin-top:6px; }

  #preview-row { display:none; gap:16px; max-width:640px; margin:0 auto 28px; }
  .preview-half { flex:1; aspect-ratio:3/4; background:#111; border:1px solid var(--border); border-radius:4px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .preview-half img { width:100%; height:100%; object-fit:contain; }
  .preview-label { font-size:10px; color:var(--gray); text-align:center; letter-spacing:.1em; text-transform:uppercase; margin-top:6px; }

  .generate-btn { display:block; margin:0 auto 40px; background:var(--accent); color:var(--bg); border:none; padding:14px 56px; font-size:12px; letter-spacing:.15em; text-transform:uppercase; font-weight:700; cursor:pointer; border-radius:2px; transition:background .15s; }
  .generate-btn:hover { background:#d4ff33; }
  .generate-btn:disabled { opacity:.3; cursor:not-allowed; }

  #status { text-align:center; font-size:12px; color:var(--gray); letter-spacing:.08em; min-height:20px; margin-bottom:32px; }
  #status.error { color:#ff5555; }

  #results { display:none; max-width:800px; margin:0 auto; gap:32px; }
  .result-card { background:#111; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .result-card img { width:100%; display:block; }
  .result-footer { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid var(--border); }
  .result-title { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); }
  .download-btn { background:transparent; border:1px solid var(--border); color:var(--fg); padding:6px 16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all .15s; text-decoration:none; }
  .download-btn:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>

<header>
  <div><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></div>
</header>

<label class="upload-zone" id="drop-zone" for="file-input">
  <input type="file" id="file-input" accept=".psd,image/*">
  <div class="upload-icon">⊕</div>
  <div class="upload-label">Subir archivo PSD</div>
  <div class="upload-hint">Se extraen frente y espalda automáticamente</div>
</label>

<div id="preview-row">
  <div><div class="preview-half"><img id="preview-front"/></div><div class="preview-label">Frente</div></div>
  <div><div class="preview-half"><img id="preview-back"/></div><div class="preview-label">Espalda</div></div>
</div>

<button class="generate-btn" id="generate-btn" disabled>Generar Mockup</button>
<div id="status"></div>

<div id="results">
  <div class="result-card">
    <img id="result-front"/>
    <div class="result-footer">
      <span class="result-title">Frente</span>
      <a class="download-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a>
    </div>
  </div>
  <div class="result-card">
    <img id="result-back"/>
    <div class="result-footer">
      <span class="result-title">Espalda</span>
      <a class="download-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a>
    </div>
  </div>
</div>

<canvas id="work-canvas" style="display:none"></canvas>

<!-- ag-psd: lee PSDs en el browser, sin servidor -->
<script src="https://cdn.jsdelivr.net/npm/ag-psd@latest/dist/bundle.js"></script>

// Coordenadas post-proceso (imagen 1536×2730, template fijo)
const POST = {
  LABEL:       { y1:1004, y2:1040, x1:1083, x2:1235 },
  GRIFA_FRONT: { x:490, y:1462 },
  GRIFA_BACK:  { y1:1453, y2:1535, x1:383, x2:450 },
};

// ─── LEER PSD con ag-psd ──────────────────────────────────────────
async function parsePSD(file) {
  const buffer   = await file.arrayBuffer();
  const psd      = agPsd.readPsd(buffer, { skipLayerImageData: false, useRawThumbnail: false });
  return psd;
}

function findLayer(children, name) {
  if (!children) return null;
  for (const c of children) {
    if (c.name === name) return c;
  }
  return null;
}

function findNested(root, ...path) {
  let curr = root;
  for (const step of path) {
    curr = findLayer(curr.children, step);
    if (!curr) return null;
  }
  return curr;
}

// Componer una remera: Main Object + estampa encima, todo sobre canvas transparente
function compositeShirt(psdWidth, psdHeight, mainObj, stampLayer) {
  const canvas = document.createElement('canvas');
  canvas.width  = psdWidth;
  canvas.height = psdHeight;
  const ctx = canvas.getContext('2d');

  // Main Object
  if (mainObj?.canvas) {
    const b = mainObj;
    ctx.drawImage(b.canvas, b.left || 0, b.top || 0);
  }

  // Estampa (si tiene imagen)
  if (stampLayer?.canvas) {
    const s = stampLayer;
    ctx.drawImage(s.canvas, s.left || 0, s.top || 0);
  } else if (stampLayer?.children) {
    // Recorrer hijos buscando canvas
    for (const child of stampLayer.children) {
      if (child.canvas) {
        ctx.drawImage(child.canvas, child.left || 0, child.top || 0);
      }
    }
  }

  // Crop a la bbox de la remera
  if (!mainObj) return canvas;
  const left   = mainObj.left   || 0;
  const top    = mainObj.top    || 0;
  const right  = mainObj.right  || psdWidth;
  const bottom = mainObj.bottom || psdHeight;

  const cropped = document.createElement('canvas');
  cropped.width  = right - left;
  cropped.height = bottom - top;
  cropped.getContext('2d').drawImage(canvas, -left, -top);
  return cropped;
}

async function extractFromPSD(file) {
  const psd = await parsePSD(file);

  // Leer layers como canvas (necesario para composite)
  const psd2 = agPsd.readPsd(await file.arrayBuffer(), {
    skipLayerImageData: false,
    useRawThumbnail: false,
    useImageData: false,
  });

  // Obtener Main Objects
  const leftMain  = findNested(psd2, 'Working Process', 'Left Shirt',  'Objects', 'Main Object');
  const rightMain = findNested(psd2, 'Working Process', 'Right Shirt', 'Objects', 'Main Object');

  // Obtener estampas
  const estampaFront = findLayer(psd2.children, 'Estampa Frontal');
  const estampaBack  = findLayer(psd2.children, 'Estampa Espalda');

  const W = psd2.width, H = psd2.height;

  const frontCanvas = compositeShirt(W, H, leftMain,  estampaFront);
  const backCanvas  = compositeShirt(W, H, rightMain, estampaBack);

  return {
    front: frontCanvas.toDataURL('image/jpeg', 0.95),
    back:  backCanvas.toDataURL('image/jpeg',  0.95),
  };
}

// ─── POST-PROCESO Canvas ──────────────────────────────────────────
function removeArtifact(imgData, y1, y2, x1, x2, rows=15) {
  const { data: d, width: w, height: h } = imgData;
  const above = [], below = [];
  for (let x=x1; x<x2; x++) {
    let r=0,g=0,b=0,n=0;
    for (let y=Math.max(0,y1-rows); y<y1; y++) { const i=(y*w+x)*4; r+=d[i];g+=d[i+1];b+=d[i+2];n++; }
    above.push(n?[r/n,g/n,b/n]:[230,230,230]);
    r=g=b=n=0;
    for (let y=y2; y<Math.min(h,y2+rows); y++) { const i=(y*w+x)*4; r+=d[i];g+=d[i+1];b+=d[i+2];n++; }
    below.push(n?[r/n,g/n,b/n]:[230,230,230]);
  }
  const rh=y2-y1;
  for (let row=0;row<rh;row++) {
    const t=rh>1?row/(rh-1):0;
    for (let col=0;col<(x2-x1);col++) {
      const i=((y1+row)*w+(x1+col))*4;
      d[i]  =Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1]=Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2]=Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return imgData;
}

async function postProcess(imgUrl, isFront) {
  return new Promise((resolve, reject) => {
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload = async () => {
      const c=document.getElementById('work-canvas');
      c.width=img.width; c.height=img.height;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,0,0);
      let d=ctx.getImageData(0,0,c.width,c.height);
      if (isFront) {
        d=removeArtifact(d,POST.LABEL.y1,POST.LABEL.y2,POST.LABEL.x1,POST.LABEL.x2);
        ctx.putImageData(d,0,0);
        const grifa=new Image();
        grifa.onload=()=>{ ctx.drawImage(grifa,POST.GRIFA_FRONT.x,POST.GRIFA_FRONT.y); resolve(c.toDataURL('image/jpeg',0.95)); };
        grifa.onerror=reject; grifa.src=GRIFA_DATA_URL;
      } else {
        d=removeArtifact(d,POST.GRIFA_BACK.y1,POST.GRIFA_BACK.y2,POST.GRIFA_BACK.x1,POST.GRIFA_BACK.x2);
        ctx.putImageData(d,0,0);
        resolve(c.toDataURL('image/jpeg',0.95));
      }
    };
    img.onerror=reject; img.src=imgUrl;
  });
}

// ─── MAIN FLOW ────────────────────────────────────────────────────
let extractedFront = null, extractedBack = null;

function setStatus(msg, isError=false) {
  const el=document.getElementById('status');
  el.textContent=msg; el.className=isError?'error':'';
}

async function onFileSelected(file) {
  if (!file) return;
  const isPSD = file.name.toLowerCase().endsWith('.psd');

  setStatus(isPSD ? 'Leyendo PSD…' : 'Procesando imagen…');
  document.getElementById('generate-btn').disabled = true;

  try {
    let front, back;

    if (isPSD) {
      // Extraer directamente del PSD
      ({ front, back } = await extractFromPSD(file));
    } else {
      // Fallback: corte inteligente por brillo (imagen .jpg/.png)
      ({ front, back } = await splitImageByGap(file));
    }

    extractedFront = front;
    extractedBack  = back;

    document.getElementById('preview-front').src = front;
    document.getElementById('preview-back').src  = back;
    document.getElementById('preview-row').style.display = 'flex';
    document.getElementById('generate-btn').disabled = false;
    setStatus(isPSD ? '✓ PSD leído — frente y espalda extraídas' : '✓ Imagen cortada');
  } catch(err) {
    console.error(err);
    setStatus('Error al procesar: ' + err.message, true);
  }
}

// Fallback: detección de gap para imágenes normales
async function splitImageByGap(file) {
  return new Promise(resolve => {
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const off=document.createElement('canvas');
      off.width=img.width; off.height=img.height;
      off.getContext('2d').drawImage(img,0,0);
      URL.revokeObjectURL(url);
      const id=off.getContext('2d').getImageData(0,0,img.width,img.height);
      const splitY=detectGap(id);
      const m=10;
      const cF=document.createElement('canvas'); cF.width=img.width; cF.height=splitY-m;
      cF.getContext('2d').drawImage(off,0,0,img.width,splitY-m,0,0,img.width,splitY-m);
      const cB=document.createElement('canvas'); cB.width=img.width; cB.height=img.height-splitY-m;
      cB.getContext('2d').drawImage(off,0,splitY+m,img.width,img.height-splitY-m,0,0,img.width,img.height-splitY-m);
      resolve({ front:cF.toDataURL('image/jpeg',.95), back:cB.toDataURL('image/jpeg',.95) });
    };
    img.src=url;
  });
}

function detectGap(imageData) {
  const {data:d,width:w,height:h}=imageData;
  const yS=Math.floor(h*.25), yE=Math.floor(h*.75);
  const bp=new Float32Array(h);
  for (let y=0;y<h;y++) { let b=0; for (let x=0;x<w;x++) { const i=(y*w+x)*4; if(d[i]>230&&d[i+1]>230&&d[i+2]>230)b++; } bp[y]=b/w; }
  let gaps=[],gs=-1;
  for (let y=yS;y<=yE;y++) { if(bp[y]>=.95&&gs<0)gs=y; if(bp[y]<.95&&gs>=0){gaps.push({s:gs,e:y});gs=-1;} }
  if(gs>=0)gaps.push({s:gs,e:yE});
  if(!gaps.length)return Math.floor(h/2);
  const best=gaps.reduce((a,b)=>b.e-b.s>a.e-a.s?b:a);
  return Math.floor((best.s+best.e)/2);
}

document.getElementById('generate-btn').addEventListener('click', async () => {
  if (!extractedFront || !extractedBack) return;
  const btn=document.getElementById('generate-btn');
  btn.disabled=true;
  document.getElementById('results').style.display='none';

  try {
    setStatus('Enviando a TopView…');

    // Enviar al proxy como data URL (base64)
    const toB64 = dataUrl => dataUrl.split(',')[1];
    const res = await fetch('/api/topview', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ frontBase64: toB64(extractedFront), backBase64: toB64(extractedBack) })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const {frontUrl, backUrl} = await res.json();

    setStatus('Aplicando post-proceso…');
    const [fp, bp] = await Promise.all([
      postProcess(`/api/topview?proxy=${encodeURIComponent(frontUrl)}`, true),
      postProcess(`/api/topview?proxy=${encodeURIComponent(backUrl)}`,  false),
    ]);

    document.getElementById('result-front').src=fp;
    document.getElementById('result-back').src=bp;
    document.getElementById('dl-front').href=fp;
    document.getElementById('dl-back').href=bp;
    document.getElementById('results').style.display='grid';
    setStatus('✓ Listo');
  } catch(err) {
    console.error(err);
    setStatus('Error: '+err.message, true);
  }
  btn.disabled=false;
});

// Eventos UI
document.getElementById('file-input').addEventListener('change', e => onFileSelected(e.target.files[0]));
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('drag-over');
  const f=e.dataTransfer.files[0]; if(!f) return;
  const dt=new DataTransfer(); dt.items.add(f);
  document.getElementById('file-input').files=dt.files;
  onFileSelected(f);
});
</script>
