<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:40px 20px}
header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
.logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.upload-area{max-width:640px;margin:0 auto 32px;border:1px dashed #2a2a2a;border-radius:4px;padding:48px;text-align:center}
.upload-area.active{border-color:var(--accent)}
.upload-icon{font-size:32px;opacity:.3;margin-bottom:12px}
.upload-title{font-size:13px;color:var(--gray);margin-bottom:8px}
.upload-hint{font-size:11px;color:#404040}
.upload-btn{display:inline-block;margin-top:16px;padding:10px 28px;background:var(--accent);color:#000;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.upload-btn:hover{background:#d4ff33}
#file-input{display:none}
#preview-row{display:none;gap:16px;max-width:640px;margin:0 auto 28px}
.preview-box{flex:1}
.preview-img{aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-img img{width:100%;height:100%;object-fit:contain}
.preview-lbl{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.gen-btn{display:block;margin:0 auto 32px;background:var(--accent);color:#000;border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.gen-btn:disabled{opacity:.3;cursor:not-allowed}
#status{text-align:center;font-size:12px;color:var(--gray);min-height:20px;margin-bottom:32px;padding:0 20px}
#status.err{color:#ff5555}
#results{display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto}
.result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.result-card img{width:100%;display:block}
.result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.dl-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></header>

<div class="upload-area" id="drop-zone">
  <div class="upload-icon">&#8853;</div>
  <div class="upload-title">Subir archivo PSD</div>
  <div class="upload-hint">Soporta todo tipo de capas</div>
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">Seleccionar archivo</button>
  <input type="file" id="file-input" accept=".psd">
</div>

<div id="preview-row" style="display:none;flex-direction:row;gap:16px;max-width:640px;margin:0 auto 28px">
  <div class="preview-box"><div class="preview-img"><img id="preview-front" src="" alt="Frente"></div><div class="preview-lbl">Frente</div></div>
  <div class="preview-box"><div class="preview-img"><img id="preview-back" src="" alt="Espalda"></div><div class="preview-lbl">Espalda</div></div>
</div>

<button class="gen-btn" id="gen-btn" disabled onclick="generate()">Generar Mockup</button>
<div id="status"></div>

<div id="results" style="display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto">
  <div class="result-card"><img id="result-front" src="" alt="Frente">
    <div class="result-footer"><span class="result-title">Frente</span><a class="dl-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a></div>
  </div>
  <div class="result-card"><img id="result-back" src="" alt="Espalda">
    <div class="result-footer"><span class="result-title">Espalda</span><a class="dl-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a></div>
  </div>
</div>

<script>

// Python code strings (stored as JS vars to avoid template literal issues)
var PY_SETUP = "import sys\nfrom types import ModuleType\n\n# Inline packbits RLE decoder (psd-tools needs this)\nclass _PBMod(ModuleType):\n    pass\n_pb = _PBMod('packbits')\n\ndef _packbits_decode(data, size=None):\n    if hasattr(data, 'tobytes'):\n        data = data.tobytes()\n    if not isinstance(data, (bytes, bytearray)):\n        data = bytes(data)\n    result = bytearray()\n    i = 0\n    while i < len(data):\n        b = data[i]\n        i += 1\n        if b < 128:\n            n = b + 1\n            result.extend(data[i:i+n])\n            i += n\n        elif b > 128:\n            n = 257 - b\n            if i < len(data):\n                result.extend([data[i]] * n)\n                i += 1\n    return bytes(result)\n\ndef _packbits_encode(data, **kwargs):\n    return bytes(data) if not isinstance(data, bytes) else data\n\n_pb.decode = _packbits_decode\n_pb.encode = _packbits_encode\nsys.modules['packbits'] = _pb\n\n# Mock optional deps (CLI/drawing - not needed for PSD reading)\nfor _m in ['docopt', 'aggdraw', 'colormath', 'colormath.color_objects', 'colormath.color_conversions', 'colormath.color_diff']:\n    if _m not in sys.modules:\n        sys.modules[_m] = ModuleType(_m)\n\nprint('dependencies mocked OK')";
var PY_INSTALL = "import micropip\nawait micropip.install('psd-tools', keep_going=True)\nprint('psd-tools installed OK')";
var PY_PROCESS = "import io, base64\nimport numpy as np\nfrom psd_tools import PSDImage\nfrom PIL import Image\n\ndef _find(layers, name):\n    for l in layers:\n        if l.name == name:\n            return l\n    return None\n\ndef _nested(root, *path):\n    cur = root\n    for s in path:\n        cur = _find(cur, s)\n        if cur is None:\n            return None\n    return cur\n\ndef _to_jpeg(img, max_dim=1400, quality=92):\n    w, h = img.size\n    if max(w, h) > max_dim:\n        s = max_dim / max(w, h)\n        img = img.resize((round(w*s), round(h*s)), Image.LANCZOS)\n    rgb = Image.new('RGB', img.size, (255, 255, 255))\n    if img.mode == 'RGBA':\n        rgb.paste(img, mask=img.split()[3])\n    else:\n        rgb.paste(img)\n    buf = io.BytesIO()\n    rgb.save(buf, 'JPEG', quality=quality)\n    return 'data:image/jpeg;base64,' + base64.b64encode(buf.getvalue()).decode()\n\ndef process_psd(raw_bytes):\n    psd = PSDImage.open(io.BytesIO(bytes(raw_bytes)))\n    W, H = psd.width, psd.height\n\n    l_shirt = _nested(psd, 'Working Process', 'Left Shirt')\n    r_shirt = _nested(psd, 'Working Process', 'Right Shirt')\n    l_main  = _nested(l_shirt, 'Objects', 'Main Object')\n    r_main  = _nested(r_shirt, 'Objects', 'Main Object')\n    e_front = _find(list(psd), 'Estampa Frontal')\n    e_back  = _find(list(psd), 'Estampa Espalda')\n    grifa   = _find(list(psd), 'Grifa Frente')\n\n    def build(shirt_group, main_obj, stamp):\n        canvas = Image.new('RGBA', (W, H), (0, 0, 0, 0))\n        sg = shirt_group.composite()\n        if sg:\n            canvas.paste(sg.convert('RGBA'),\n                         (shirt_group.bbox[0], shirt_group.bbox[1]),\n                         sg.convert('RGBA'))\n        if stamp:\n            si = stamp.composite()\n            if si:\n                sa = np.array(si.convert('RGBA'))\n                if (sa[:,:,3] > 10).sum() > 50:\n                    canvas.paste(si.convert('RGBA'),\n                                 (stamp.bbox[0], stamp.bbox[1]),\n                                 si.convert('RGBA'))\n        b = main_obj.bbox\n        return canvas.crop((b[0], b[1], b[2], b[3]))\n\n    front_img = build(l_shirt, l_main, e_front)\n\n    # Remove grifa area from front (added in post-processing)\n    if grifa and l_main:\n        gx = grifa.left - l_main.left\n        gy = grifa.top  - l_main.top\n        gw = grifa.right  - grifa.left\n        gh = grifa.bottom - grifa.top\n        sample_x = max(0, gx - 10)\n        sample_y = max(0, gy + gh // 2)\n        try:\n            sc = front_img.getpixel((sample_x, sample_y))\n            fill = Image.new('RGBA', (gw + 8, gh + 8),\n                             (sc[0], sc[1], sc[2], 255))\n            front_img.paste(fill, (max(0, gx - 4), max(0, gy - 4)))\n        except Exception:\n            pass\n\n    back_img = build(r_shirt, r_main, e_back)\n    return _to_jpeg(front_img), _to_jpeg(back_img)";

// Load Pyodide
async function loadPy() {
  if (pyodide) return pyodide;
  if (pyPromise) return pyPromise;
  pyPromise = (async function() {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js";
    document.head.appendChild(s);
    await new Promise(function(res, rej) { s.onload = res; s.onerror = function() { rej(new Error("No se pudo cargar Pyodide")); }; });
    var py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/" });
    st("Cargando dependencias Python...");
    await py.loadPackage(["pillow", "numpy", "micropip", "attrs"]);
    st("Instalando psd-tools...");
    await py.runPythonAsync(PY_SETUP);
    await py.runPythonAsync("import micropip");
    await py.runPythonAsync(
  "import micropip\n" +
  "try:\n" +
  "    import asyncio\n" +
  "    await micropip.install(\'psd-tools\', keep_going=True)\n" +
  "    print(\'psd-tools OK\')\n" +
  "except ValueError as e:\n" +
  "    print(\'Aviso (deps opcionales faltantes):\', str(e)[:120])\n" +
  "except Exception as e:\n" +
  "    raise\n"
);
    st("Motor Python listo");
    pyodide = py;
    return py;
  })();
  return pyPromise;
}

async function processPSD(file) {
  var py = await loadPy();
  var buf = await file.arrayBuffer();
  py.globals.set("_raw", py.toPy(new Uint8Array(buf)));
  await py.runPythonAsync(PY_PROCESS);
  var result = await py.runPythonAsync("process_psd(_raw)");
  var arr = result.toJs();
  return { front: arr[0], back: arr[1] };
}

// ag-psd quick preview
function findL(list, name) {
  for (var i = 0; i < (list||[]).length; i++) {
    if (list[i].name === name) return list[i];
  }
  return null;
}
function findN(root) {
  var cur = root;
  for (var i = 1; i < arguments.length; i++) {
    cur = findL(cur && cur.children, arguments[i]);
    if (!cur) return null;
  }
  return cur;
}
function rsz(src) {
  var w=src.width, h=src.height;
  if (w<=MAX_DIM && h<=MAX_DIM) return src;
  var s=MAX_DIM/Math.max(w,h), c=document.createElement("canvas");
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c;
}
function quickPreview(buf) {
  var psd = agPsd.readPsd(buf, {skipLayerImageData:false, useRawThumbnail:false});
  var lM = findN(psd,"Working Process","Left Shirt","Objects","Main Object");
  var rM = findN(psd,"Working Process","Right Shirt","Objects","Main Object");
  function crop(m) {
    if (!m || !m.canvas) return null;
    var c=document.createElement("canvas");
    c.width=m.right-m.left; c.height=m.bottom-m.top;
    var ctx=c.getContext("2d");
    ctx.fillStyle="#eee"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(m.canvas,0,0);
    return rsz(c);
  }
  var fc=crop(lM), bc=crop(rM);
  return { front: fc ? fc.toDataURL("image/jpeg",0.85) : null,
           back:  bc ? bc.toDataURL("image/jpeg",0.85) : null };
}

async function onFile(file) {
  if (!file) return;
  document.getElementById("gen-btn").disabled = true;
  frontDataUrl = null; backDataUrl = null;
  try {
    st("Leyendo PSD...");
    var buf = await file.arrayBuffer();
    // Quick preview with ag-psd
    try {
      var prev = quickPreview(buf);
      if (prev.front) document.getElementById("preview-front").src = prev.front;
      if (prev.back)  document.getElementById("preview-back").src  = prev.back;
      document.getElementById("preview-row").style.display = "flex";
    } catch(e) { console.warn("preview:", e); }
    // Full processing with Python
    st("Procesando PSD con Python (20-40s la primera vez)...");
    var result = await processPSD(file);
    frontDataUrl = result.front;
    backDataUrl  = result.back;
    document.getElementById("preview-front").src = frontDataUrl;
    document.getElementById("preview-back").src  = backDataUrl;
    document.getElementById("preview-row").style.display = "flex";
    document.getElementById("gen-btn").disabled = false;
    st("Listo — generá el mockup");
  } catch(err) {
    console.error(err);
    st("Error: " + err.message, true);
  }
}

// Post-processing
function detectOff(d,w,h) {
  function avg(x,y) { var i=(y*w+x)*4; return (d[i]+d[i+1]+d[i+2])/3; }
  var fondo = (avg(20,20)+avg(w-20,20))/2;
  var cs = [];
  for (var y=Math.floor(h*.45); y<Math.floor(h*.82); y+=15) {
    var l=-1, r=-1;
    for (var x=0; x<w; x++) { var i=(y*w+x)*4; if (Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18) { l=x; break; } }
    for (var x=w-1; x>=0; x--) { var i=(y*w+x)*4; if (Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18) { r=x; break; } }
    if (l>0 && r>0 && r-l>w*.25) cs.push((l+r)/2);
  }
  if (!cs.length) return 0;
  cs.sort(function(a,b){return a-b;});
  var o = Math.round(cs[Math.floor(cs.length/2)] - w/2);
  return Math.max(-180, Math.min(180, Math.abs(o)<15 ? 0 : o));
}
function center(canvas, ctx, off) {
  if (!off) return;
  var tmp=document.createElement("canvas"); tmp.width=canvas.width; tmp.height=canvas.height;
  tmp.getContext("2d").drawImage(canvas,0,0);
  var bg=ctx.getImageData(20,20,1,1).data;
  ctx.fillStyle="rgb("+bg[0]+","+bg[1]+","+bg[2]+")";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(tmp,-off,0);
}
function removeArt(id, y1,y2,x1,x2) {
  var d=id.data, w=id.width, h=id.height, rows=15;
  var above=[], below=[];
  for (var x=x1; x<x2; x++) {
    var r=0,g=0,b=0,n=0;
    for (var y=Math.max(0,y1-rows); y<y1; y++) { var i=(y*w+x)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
    above.push(n ? [r/n,g/n,b/n] : [230,230,230]);
    r=g=b=n=0;
    for (var y=y2; y<Math.min(h,y2+rows); y++) { var i=(y*w+x)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
    below.push(n ? [r/n,g/n,b/n] : [230,230,230]);
  }
  for (var row=0; row<y2-y1; row++) {
    var t = (y2-y1)>1 ? row/(y2-y1-1) : 0;
    for (var col=0; col<x2-x1; col++) {
      var i=((y1+row)*w+(x1+col))*4;
      d[i]   = Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1] = Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2] = Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return id;
}
async function postProcess(imgUrl, isFront) {
  return new Promise(function(resolve, reject) {
    var img = new Image(); img.crossOrigin = "anonymous";
    img.onerror = function() { reject(new Error("No se pudo cargar imagen")); };
    img.onload = function() {
      var c = document.getElementById("work-canvas");
      c.width=img.width; c.height=img.height;
      var ctx=c.getContext("2d"); ctx.drawImage(img,0,0);
      center(c, ctx, detectOff(ctx.getImageData(0,0,c.width,c.height).data, c.width, c.height));
      if (isFront) {
        var id = ctx.getImageData(0,0,c.width,c.height);
        id = removeArt(id, LABEL_Y1,LABEL_Y2,LABEL_X1,LABEL_X2);
        ctx.putImageData(id,0,0);
        var ci = ctx.getImageData(0,0,c.width,c.height);
        var cw=c.width, ch=c.height;
        var cf = (ci.data[20*4]+ci.data[20*4+1]+ci.data[20*4+2])/3*0.5
               + (ci.data[(20*cw+(cw-20))*4]+ci.data[(20*cw+(cw-20))*4+1]+ci.data[(20*cw+(cw-20))*4+2])/3*0.5;
        var edges = [];
        for (var sy=Math.floor(ch*.51); sy<Math.floor(ch*.57); sy+=4) {
          for (var sx=cw-1; sx>=cw/2; sx--) {
            var si=(sy*cw+sx)*4;
            if (Math.abs((ci.data[si]+ci.data[si+1]+ci.data[si+2])/3-cf)>18) { edges.push(sx); break; }
          }
        }
        edges.sort(function(a,b){return a-b;});
        var se = edges.length ? edges[Math.floor(edges.length/2)] : cw-80;
        var g = new Image();
        g.onload = function() { ctx.drawImage(g, se-g.width, Math.floor(ch*.555)); resolve(c.toDataURL("image/jpeg",.95)); };
        g.onerror = function() { resolve(c.toDataURL("image/jpeg",.95)); };
        g.src = GRIFA;
      } else {
        resolve(c.toDataURL("image/jpeg",.95));
      }
    };
    img.src = imgUrl;
  });
}

// API
async function apiPost(q, body) {
  var res = await fetch("/api/topview?" + q, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  var txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error("HTTP " + res.status + ": " + txt.slice(0,300)); }
}
async function apiGet(q) {
  var res = await fetch("/api/topview?" + q);
  var txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { throw new Error("HTTP " + res.status + ": " + txt.slice(0,300)); }
}
async function upload(b64) {
  var d = await apiPost("upload=1", {imageBase64: b64});
  if (!d.ok) throw new Error("Upload: " + (d.error || JSON.stringify(d)));
  return d.fileId;
}
async function submitTask(p, t, m) {
  var d = await apiPost("submit=1", {productImageFileId:p, templateImageFileId:t, templateMaskFileId:m});
  if (!d.ok) throw new Error("Submit: " + (d.error || JSON.stringify(d)));
  return d.taskId;
}
async function poll(taskId, cb) {
  for (var i=0; i<40; i++) {
    await new Promise(function(r){setTimeout(r,3000);});
    var d;
    try { d = await apiGet("query=" + encodeURIComponent(taskId)); }
    catch(e) { console.warn("poll", e); continue; }
    if (d.code !== "200") throw new Error("TopView: " + JSON.stringify(d).slice(0,300));
    var r = d.result || d;
    var s = r.status || "?";
    if (cb) cb(s, i);
    console.log("Poll " + (i+1) + " status=" + s);
    if (s === "success") {
      var imgs = r.anyfitImages || [];
      var url = imgs[0] && imgs[0].url;
      if (!url) throw new Error("Sin URL: " + JSON.stringify(d).slice(0,200));
      return url;
    }
    if (s === "fail" || s === "failed") throw new Error("Tarea fallida: " + (r.errorMsg || "?"));
  }
  throw new Error("Timeout (2min). Intentá de nuevo.");
}
async function generate() {
  if (!frontDataUrl || !backDataUrl) return;
  var btn = document.getElementById("gen-btn"); btn.disabled = true;
  document.getElementById("results").style.display = "none";
  try {
    function b64(url) { return url.split(",")[1]; }
    st("Subiendo frente...");  var fId = await upload(b64(frontDataUrl));
    st("Subiendo espalda..."); var bId = await upload(b64(backDataUrl));
    st("Creando tareas...");
    var fTask = await submitTask(fId, TMPL_F, MASK_F);
    var bTask = await submitTask(bId, TMPL_B, MASK_B);
    st("Generando (30-60s)...");
    var urls = await Promise.all([
      poll(fTask, function(s,i){ st("Generando... " + (i*3) + "s — frente:" + s); }),
      poll(bTask)
    ]);
    st("Post-proceso...");
    var fp = await postProcess("/api/topview?proxy=" + encodeURIComponent(urls[0]), true);
    var bp = await postProcess("/api/topview?proxy=" + encodeURIComponent(urls[1]), false);
    document.getElementById("result-front").src = fp;
    document.getElementById("result-back").src  = bp;
    document.getElementById("dl-front").href = fp;
    document.getElementById("dl-back").href  = bp;
    document.getElementById("results").style.display = "flex";
    st("Listo");
  } catch(err) {
    console.error(err); st("Error: " + err.message, true);
  }
  btn.disabled = false;
}

document.getElementById("file-input").addEventListener("change", function() { onFile(this.files[0]); this.value = ""; });
var dz = document.getElementById("drop-zone");
dz.addEventListener("dragover", function(e) { e.preventDefault(); dz.classList.add("active"); });
dz.addEventListener("dragleave", function() { dz.classList.remove("active"); });
dz.addEventListener("drop", function(e) { e.preventDefault(); dz.classList.remove("active"); onFile(e.dataTransfer.files[0]); });
