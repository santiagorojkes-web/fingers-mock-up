<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#1f1f1f}
  body{background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:40px 20px}
  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
  .logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase}
  .upload-zone{display:block;border:1px dashed #2a2a2a;border-radius:4px;padding:56px 40px;text-align:center;cursor:pointer;transition:border-color .2s;max-width:640px;margin:0 auto 32px}
  .upload-zone:hover{border-color:var(--accent)}
  .upload-zone.drag-over{border-color:var(--accent);background:rgba(200,255,0,.03)}
  #file-input{display:none}
  .upload-icon{font-size:28px;margin-bottom:14px;opacity:.35}
  .upload-label{font-size:13px;color:var(--gray);letter-spacing:.05em}
  .upload-hint{font-size:11px;color:#404040;margin-top:6px}
  #preview-row{display:none;gap:16px;max-width:640px;margin:0 auto 28px}
  .preview-half{flex:1;aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .preview-half img{width:100%;height:100%;object-fit:contain}
  .preview-label{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
  .generate-btn{display:block;margin:0 auto 40px;background:var(--accent);color:var(--bg);border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px;transition:background .15s}
  .generate-btn:hover{background:#d4ff33}
  .generate-btn:disabled{opacity:.3;cursor:not-allowed}
  #status{text-align:center;font-size:12px;color:var(--gray);letter-spacing:.08em;min-height:20px;margin-bottom:32px}
  #status.error{color:#ff5555}
  #results{display:none;max-width:800px;margin:0 auto;gap:32px}
  .result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .result-card img{width:100%;display:block}
  .result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
  .result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
  .download-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .15s;text-decoration:none}
  .download-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header>
  <div><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></div>
</header>

<label class="upload-zone" id="drop-zone" for="file-input">
  <input type="file" id="file-input" accept=".psd,image/*">
  <div class="upload-icon">⊕</div>
  <div class="upload-label">Subir archivo PSD</div>
  <div class="upload-hint">Se extraen frente y espalda automáticamente</div>
</label>

<div id="preview-row">
  <div><div class="preview-half"><img id="preview-front"/></div><div class="preview-label">Frente</div></div>
  <div><div class="preview-half"><img id="preview-back"/></div><div class="preview-label">Espalda</div></div>
</div>

<button class="generate-btn" id="generate-btn" disabled>Generar Mockup</button>
<div id="status"></div>

<div id="results">
  <div class="result-card">
    <img id="result-front"/>
    <div class="result-footer">
      <span class="result-title">Frente</span>
      <a class="download-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a>
    </div>
  </div>
  <div class="result-card">
    <img id="result-back"/>
    <div class="result-footer">
      <span class="result-title">Espalda</span>
      <a class="download-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a>
    </div>
  </div>
</div>
<canvas id="work-canvas" style="display:none"></canvas>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@latest/dist/bundle.js"></script>

// ── Resize antes de enviar (Vercel limit ~4.5MB) ──────────────────
const MAX_DIM = 1400;
function resizeCanvas(src) {
  const {width:w,height:h} = src;
  if (w<=MAX_DIM && h<=MAX_DIM) return src;
  const s=MAX_DIM/Math.max(w,h);
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}

// ── PSD parsing ───────────────────────────────────────────────────
function findLayer(children,name){return(children||[]).find(c=>c.name===name)||null;}
function findNested(root,...path){let cur=root;for(const s of path){cur=findLayer(cur.children,s);if(!cur)return null;}return cur;}
// ── Blanquear remera: el Main Object gris → blanco ────────────────
function whitenCanvas(canvas) {
  const ctx=canvas.getContext('2d');
  const id=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data;
  // Encontrar min/max de pixels de la tela (claros, no stamps oscuros)
  let mn=255,mx=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10 && d[i]>120 && d[i+1]>120 && d[i+2]>120){
      const v=(d[i]+d[i+1]+d[i+2])/3;
      if(v<mn)mn=v; if(v>mx)mx=v;
    }
  }
  if(mx<=mn) return canvas;
  const range=mx-mn;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10 && d[i]>120 && d[i+1]>120 && d[i+2]>120){
      d[i]  =Math.round(200+(d[i]  -mn)/range*55);
      d[i+1]=Math.round(200+(d[i+1]-mn)/range*55);
      d[i+2]=Math.round(200+(d[i+2]-mn)/range*55);
    }
  }
  ctx.putImageData(id,0,0);
  return canvas;
}

function compositeShirt(W,H,mainObj,stampLayer){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  if(mainObj?.canvas)ctx.drawImage(mainObj.canvas,mainObj.left||0,mainObj.top||0);
  const draw=l=>{if(!l)return;if(l.canvas)ctx.drawImage(l.canvas,l.left||0,l.top||0);(l.children||[]).forEach(draw);};
  draw(stampLayer);
  if(!mainObj)return c;
  const crop=document.createElement('canvas');
  const {left:l=0,top:t=0,right:r=W,bottom:b=H}=mainObj;
  crop.width=r-l;crop.height=b-t;
  crop.getContext('2d').drawImage(c,-l,-t);
  whitenCanvas(crop);    // blanquear tela gris → blanco
  return resizeCanvas(crop);
}
async function extractFromPSD(file){
  const buf=await file.arrayBuffer();
  const psd=agPsd.readPsd(buf,{skipLayerImageData:false,useRawThumbnail:false,useImageData:false});
  const W=psd.width,H=psd.height;
  const leftMain =findNested(psd,'Working Process','Left Shirt','Objects','Main Object');
  const rightMain=findNested(psd,'Working Process','Right Shirt','Objects','Main Object');
  const eFront=findLayer(psd.children,'Estampa Frontal');
  const eBack =findLayer(psd.children,'Estampa Espalda');
  const fC=compositeShirt(W,H,leftMain,eFront);
  const bC=compositeShirt(W,H,rightMain,eBack);
  console.log(`Front ${fC.width}x${fC.height}, Back ${bC.width}x${bC.height}`);
  return{front:fC.toDataURL('image/jpeg',.92),back:bC.toDataURL('image/jpeg',.92)};
}

// ── Centering: detectar offset y centrar imagen ────────────────────
function detectOffset(imgData) {
  const {data:d,width:w,height:h}=imgData;
  // Fondo: promedio de esquinas
  const corners=[
    (d[30*w*4]+d[30*w*4+1]+d[30*w*4+2])/3,
    (d[(30*w+w-30)*4]+(d[(30*w+w-30)*4+1])+d[(30*w+w-30)*4+2])/3,
  ];
  const fondo=(corners[0]+corners[1])/2;
  const centers=[];
  // Escanear desde 45% hasta 80% (incluye zona del torso)
  for(let y=Math.floor(h*.45);y<Math.floor(h*.80);y+=20){
    let left=-1,right=-1;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){left=x;break;}
    }
    for(let x=w-1;x>=0;x--){
      const i=(y*w+x)*4;
      if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){right=x;break;}
    }
    if(left>0&&right>0&&right-left>w*0.3) centers.push((left+right)/2);
  }
  if(!centers.length) return 0;
  const sorted=centers.slice().sort((a,b)=>a-b);
  const med=sorted[Math.floor(sorted.length/2)];
  console.log('Model centers:', sorted.map(v=>Math.round(v)), 'median:', Math.round(med));
  return Math.round(med - w/2);
}

function centerCanvas(canvas, ctx, offset) {
  if(Math.abs(offset)<10) return;          // sin shift si ya está bien
  const tmp=document.createElement('canvas');
  tmp.width=canvas.width; tmp.height=canvas.height;
  tmp.getContext('2d').drawImage(canvas,0,0);

  // Fondo: color de la esquina
  const bg=ctx.getImageData(30,30,1,1).data;
  ctx.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Dibujar contenido desplazado
  ctx.drawImage(tmp,-offset,0);            // shift left = dibujar en -offset
}

// ── Post-proceso ──────────────────────────────────────────────────
function removeArtifact(imgData,y1,y2,x1,x2,rows=15){
  const {data:d,width:w,height:h}=imgData;
  const above=[],below=[];
  for(let x=x1;x<x2;x++){
    let r=0,g=0,b=0,n=0;
    for(let y=Math.max(0,y1-rows);y<y1;y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    above.push(n?[r/n,g/n,b/n]:[230,230,230]);
    r=g=b=n=0;
    for(let y=y2;y<Math.min(h,y2+rows);y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    below.push(n?[r/n,g/n,b/n]:[230,230,230]);
  }
  const rh=y2-y1;
  for(let row=0;row<rh;row++){
    const t=rh>1?row/(rh-1):0;
    for(let col=0;col<(x2-x1);col++){
      const i=((y1+row)*w+(x1+col))*4;
      d[i]  =Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1]=Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2]=Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return imgData;
}
async function postProcess(imgUrl,isFront){
  return new Promise((resolve,reject)=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=async()=>{
      const c=document.getElementById('work-canvas');
      c.width=img.width;c.height=img.height;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0);

      // 1. Detectar y centrar el modelo
      const rawData=ctx.getImageData(0,0,c.width,c.height);
      const offset=detectOffset(rawData);
      console.log(`${isFront?'Frente':'Espalda'} offset: ${offset>0?'+':''}${offset}px`);
      centerCanvas(c,ctx,offset);

      // 2. Post-proceso en la imagen ya centrada
      let d=ctx.getImageData(0,0,c.width,c.height);
      if(isFront){
        // Remover etiqueta interna del cuello
        d=removeArtifact(d,POST.LABEL.y1,POST.LABEL.y2,POST.LABEL.x1,POST.LABEL.x2);
        ctx.putImageData(d,0,0);
        // Agregar grifa en manga (posición calibrada para imagen centrada)
        const g=new Image();
        g.onload=()=>{ctx.drawImage(g,POST.GRIFA_FRONT.x,POST.GRIFA_FRONT.y);resolve(c.toDataURL('image/jpeg',.95));};
        g.onerror=reject;g.src=GRIFA_DATA_URL;
      }else{
        // En espalda: solo centar (sin grifa, sin etiqueta)
        resolve(c.toDataURL('image/jpeg',.95));
      }
    };
    img.onerror=reject;img.src=imgUrl;
  });
}

// ── API calls ─────────────────────────────────────────────────────
async function apiPost(queryParam, body) {
  const res=await fetch(`/api/topview?${queryParam}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const text=await res.text();
  try{return JSON.parse(text);}
  catch{throw new Error(`Servidor HTTP ${res.status}: ${text.slice(0,200)}`);}
}

async function apiGet(queryParam) {
  const res=await fetch(`/api/topview?${queryParam}`);
  const text=await res.text();
  try{return JSON.parse(text);}
  catch{throw new Error(`Servidor HTTP ${res.status}: ${text.slice(0,200)}`);}
}

async function uploadImage(base64) {
  const d=await apiPost('upload=1',{imageBase64:base64});
  if(!d.ok) throw new Error('Upload: '+(d.error||JSON.stringify(d)));
  return d.fileId;
}

async function submitTask(productFileId, templateFileId, maskFileId) {
  const d=await apiPost('submit=1',{
    productImageFileId:  productFileId,
    templateImageFileId: templateFileId,
    templateMaskFileId:  maskFileId,
  });
  if(!d.ok) throw new Error('Submit: '+(d.error||JSON.stringify(d)));
  return d.taskId;
}

async function pollTask(taskId, onStatus) {
  for(let i=0;i<80;i++){
    await new Promise(r=>setTimeout(r,3000));
    const d=await apiGet(`query=${encodeURIComponent(taskId)}`);
    if(d.code!=='200') throw new Error('Query: '+JSON.stringify(d));
    // result puede estar en d.result o directo en d
    const r=d.result||d;
    const s=r.status;
    if(onStatus)onStatus(s,i);
    if(s==='success'){
      const url=(r.anyfitImages||[])[0]?.url;
      if(!url) throw new Error('Sin URL: '+JSON.stringify(d));
      return url;
    }
    if(s==='fail'||s==='failed') throw new Error('Fallida: '+(r.errorMsg||'sin detalle'));
  }
  throw new Error('Timeout');
}

// ── UI ────────────────────────────────────────────────────────────
let eFront=null,eBack=null;
function setStatus(msg,isError=false){
  const el=document.getElementById('status');el.textContent=msg;el.className=isError?'error':'';
}

async function onFileSelected(file){
  if(!file)return;
  setStatus(file.name.endsWith('.psd')?'Leyendo PSD…':'Procesando imagen…');
  document.getElementById('generate-btn').disabled=true;
  try{
    if(file.name.toLowerCase().endsWith('.psd'))
      ({front:eFront,back:eBack}=await extractFromPSD(file));
    else {
      // Fallback: subir imagen sin cortar (asume que el usuario sube frente y espalda por separado)
      eFront=eBack=URL.createObjectURL(file);
    }
    document.getElementById('preview-front').src=eFront;
    document.getElementById('preview-back').src=eBack||eFront;
    document.getElementById('preview-row').style.display='flex';
    document.getElementById('generate-btn').disabled=false;
    const kb=s=>Math.round((s?.length||0)*.75/1024);
    setStatus(`✓ PSD leído — frente ~${kb(eFront)}KB · espalda ~${kb(eBack)}KB`);
  }catch(err){console.error(err);setStatus('Error: '+err.message,true);}
}

document.getElementById('generate-btn').addEventListener('click',async()=>{
  if(!eFront||!eBack)return;
  const btn=document.getElementById('generate-btn');
  btn.disabled=true;
  document.getElementById('results').style.display='none';
  try{
    const toB64=url=>url.split(',')[1];

    setStatus('Subiendo frente a TopView…');
    const frontFileId=await uploadImage(toB64(eFront));

    setStatus('Subiendo espalda a TopView…');
    const backFileId=await uploadImage(toB64(eBack));

    setStatus('Creando tareas…');
    const [frontTaskId,backTaskId]=await Promise.all([
      submitTask(frontFileId, TEMPLATE_FRONT, MASK_FRONT),
      submitTask(backFileId,  TEMPLATE_BACK,  MASK_BACK),
    ]);

    setStatus('Generando mockups… (30–60s)');
    const [frontUrl,backUrl]=await Promise.all([
      pollTask(frontTaskId,(s,i)=>setStatus(`Generando… (${i*3}s) — frente:${s}`)),
      pollTask(backTaskId),
    ]);

    setStatus('Aplicando post-proceso…');
    const [fp,bp]=await Promise.all([
      postProcess(`/api/topview?proxy=${encodeURIComponent(frontUrl)}`,true),
      postProcess(`/api/topview?proxy=${encodeURIComponent(backUrl)}`,false),
    ]);

    document.getElementById('result-front').src=fp;
    document.getElementById('result-back').src=bp;
    document.getElementById('dl-front').href=fp;
    document.getElementById('dl-back').href=bp;
    document.getElementById('results').style.display='grid';
    setStatus('✓ Listo');
  }catch(err){console.error(err);setStatus('Error: '+err.message,true);}
  btn.disabled=false;
});

document.getElementById('file-input').addEventListener('change',e=>onFileSelected(e.target.files[0]));
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('drag-over');
  const f=e.dataTransfer.files[0];if(!f)return;
  const dt=new DataTransfer();dt.items.add(f);
  document.getElementById('file-input').files=dt.files;onFileSelected(f);
});
</script>
