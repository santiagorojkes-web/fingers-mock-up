<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:40px 20px}
header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
.logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.upload-area{max-width:640px;margin:0 auto 32px;border:1px dashed #2a2a2a;border-radius:4px;padding:48px;text-align:center}
.upload-area.active{border-color:var(--accent)}
.upload-icon{font-size:32px;opacity:.3;margin-bottom:12px}
.upload-title{font-size:13px;color:var(--gray);margin-bottom:8px}
.upload-hint{font-size:11px;color:#404040}
.upload-btn{display:inline-block;margin-top:16px;padding:10px 28px;background:var(--accent);color:#000;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.upload-btn:hover{background:#d4ff33}
#file-input{display:none}
.preview-box{flex:1}
.preview-img{aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-img img{width:100%;height:100%;object-fit:contain}
.preview-lbl{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.gen-btn{display:block;margin:0 auto 32px;background:var(--accent);color:#000;border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.gen-btn:disabled{opacity:.3;cursor:not-allowed}
#status{text-align:center;font-size:12px;color:var(--gray);min-height:20px;margin-bottom:32px;padding:0 20px}
#status.err{color:#ff5555}
#results{display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto}
.result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.result-card img{width:100%;display:block}
.result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.dl-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></header>
<div class="upload-area" id="drop-zone">
  <div class="upload-icon">&#8853;</div>
  <div class="upload-title">Subir archivo PSD</div>
  <div class="upload-hint">Soporta todo tipo de capas</div>
  <label class="upload-btn" for="file-input" style="display:inline-block;cursor:pointer">Seleccionar archivo</label>
  <input type="file" id="file-input" accept="*" style="display:none">
</div>
<div id="preview-row" style="display:none;flex-direction:row;gap:16px;max-width:640px;margin:0 auto 28px">
  <div class="preview-box"><div class="preview-img"><img id="preview-front" src="" alt="Frente"></div><div class="preview-lbl">Frente</div></div>
  <div class="preview-box"><div class="preview-img"><img id="preview-back" src="" alt="Espalda"></div><div class="preview-lbl">Espalda</div></div>
</div>
<button class="gen-btn" id="gen-btn" disabled onclick="generate()">Descargar Mockups</button>
<div id="status"></div>
<div id="results" style="display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto">
  <div class="result-card"><img id="result-front" src="" alt="Frente">
    <div class="result-footer"><span class="result-title">Frente</span><a class="dl-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a></div>
  </div>
  <div class="result-card"><img id="result-back" src="" alt="Espalda">
    <div class="result-footer"><span class="result-title">Espalda</span><a class="dl-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a></div>
  </div>
</div>
<canvas id="work-canvas" style="display:none"></canvas>

var PY_SETUP="import sys, io, tarfile, tempfile, types, re\nimport numpy as np\nfrom PIL import Image, ImageDraw, ImageFilter\n\nclass _PBMod(types.ModuleType): pass\n_pb = _PBMod('packbits')\ndef _pb_decode(data, size=None):\n    if hasattr(data,'tobytes'): data=data.tobytes()\n    if not isinstance(data,(bytes,bytearray)): data=bytes(data)\n    r=bytearray(); i=0\n    while i<len(data):\n        b=data[i]; i+=1\n        if b<128: n=b+1; r.extend(data[i:i+n]); i+=n\n        elif b>128:\n            n=257-b\n            if i<len(data): r.extend([data[i]]*n); i+=1\n    return bytes(r)\n_pb.decode=_pb_decode\n_pb.encode=lambda d,**kw: bytes(d) if not isinstance(d,bytes) else d\nsys.modules['packbits']=_pb\n\ndef _bezier(p0,p1,p2,p3,n=20):\n    t=np.linspace(0,1,n)\n    return(((1-t)**3)[:,None]*p0+(3*(1-t)**2*t)[:,None]*p1+(3*(1-t)*t**2)[:,None]*p2+(t**3)[:,None]*p3).tolist()\ndef _parse_svg_path(pathd):\n    pts=[]; cx=cy=0.0; toks=str(pathd).split(); i=0\n    while i<len(toks):\n        t=toks[i]\n        if t=='M':\n            i+=1\n            if i+1<len(toks):\n                try: cx,cy=float(toks[i]),float(toks[i+1]); pts.append((cx,cy)); i+=2\n                except: i+=1\n        elif t=='C':\n            i+=1\n            while i+5<len(toks):\n                try:\n                    p1x,p1y=float(toks[i]),float(toks[i+1]); p2x,p2y=float(toks[i+2]),float(toks[i+3]); ex,ey=float(toks[i+4]),float(toks[i+5])\n                    for p in _bezier(np.array([cx,cy]),np.array([p1x,p1y]),np.array([p2x,p2y]),np.array([ex,ey])): pts.append((p[0],p[1]))\n                    cx,cy=ex,ey; i+=6\n                except: break\n        elif t in ('Z','z'): i+=1\n        else: i+=1\n    return pts\nclass _Draw:\n    def __init__(self,image): self._img=image; self._imd=ImageDraw.Draw(image); self._mode=image.mode\n    def symbol(self,xy,sym,pen=None,brush=None):\n        if sym is None or not hasattr(sym,'_pts') or not sym._pts or len(sym._pts)<3: return\n        x=xy[0] if isinstance(xy,(list,tuple)) else xy; y=xy[1] if isinstance(xy,(list,tuple)) else 0\n        if self._mode=='L':\n            c=brush._color if brush else 255\n            c=c if isinstance(c,int) else int(sum(c[:3])/3) if isinstance(c,(list,tuple)) else 255\n        else: c=brush._color if brush else (0,0,0,255)\n        flat=[(p[0]+x,p[1]+y) for p in sym._pts]\n        if len(flat)>=3:\n            try: self._imd.polygon(flat,fill=c)\n            except: pass\n    def flush(self): pass\nclass _Symbol:\n    def __init__(self,pathd,scale=None): self._pts=_parse_svg_path(pathd)\nclass _Pen:\n    def __init__(self,color='black',width=1): self._color=color if isinstance(color,int) else (0,0,0)\nclass _Brush:\n    def __init__(self,color='black'):\n        if isinstance(color,int): self._color=color\n        elif isinstance(color,str):\n            try: from PIL import ImageColor; self._color=ImageColor.getrgb(color)\n            except: self._color=(0,0,0)\n        elif isinstance(color,(list,tuple)): self._color=tuple(color)\n        else: self._color=(0,0,0)\nagg=types.ModuleType('aggdraw'); agg.Draw=_Draw; agg.Symbol=_Symbol; agg.Pen=_Pen; agg.Brush=_Brush\nsys.modules['aggdraw']=agg\nfor _m in ['docopt','colormath','colormath.color_objects','colormath.color_conversions','colormath.color_diff']:\n    sys.modules.setdefault(_m,types.ModuleType(_m))\ndef _gaussian(img,sigma=1,**kw):\n    if isinstance(img,np.ndarray):\n        mx=img.max(); sc=255. if mx<=1 else 1.\n        pil=Image.fromarray((img*255).astype(np.uint8) if mx<=1 else img.astype(np.uint8))\n        return np.array(pil.filter(ImageFilter.GaussianBlur(radius=float(sigma)))).astype(np.float32)/sc\n    return img\ndef _disk(r):\n    d=int(r*2+1); a=np.zeros((d,d),np.uint8); c=d//2\n    for y in range(d):\n        for x in range(d):\n            if (y-c)**2+(x-c)**2<=r**2: a[y,x]=1\n    return a\ndef _resize(img,output_shape,**kw):\n    if isinstance(img,np.ndarray):\n        h,w=output_shape[:2]; mx=img.max(); sc=255. if mx<=1 else 1.\n        pil=Image.fromarray((img*255).astype(np.uint8) if mx<=1 else img.astype(np.uint8))\n        return np.array(pil.resize((w,h),Image.LANCZOS)).astype(np.float32)/sc\n    return img\n_sk=types.ModuleType('skimage'); _skf=types.ModuleType('skimage.filters')\n_skm=types.ModuleType('skimage.morphology'); _skt=types.ModuleType('skimage.transform')\n_skf.gaussian=_gaussian; _skm.disk=_disk; _skt.resize=_resize\n_sk.filters=_skf; _sk.morphology=_skm; _sk.transform=_skt\nsys.modules.update({'skimage':_sk,'skimage.filters':_skf,'skimage.morphology':_skm,'skimage.transform':_skt})\nprint('mocks OK')";
var PY_INSTALL="import sys, io, tarfile, tempfile\nfrom pyodide.http import pyfetch\nprint('Downloading psd-tools...')\nresp = await pyfetch('https://files.pythonhosted.org/packages/5c/fc/29b0d2fb9e0fadf214b7ce6b236449f374393d1bec0b52efb68400f373bc/psd_tools-1.9.34.tar.gz')\ndata = await resp.bytes()\nprint('Downloaded', len(data), 'bytes')\ntmpdir = tempfile.mkdtemp()\nwith tarfile.open(fileobj=io.BytesIO(bytes(data)), mode='r:gz') as tar:\n    n=0\n    for m in tar.getmembers():\n        idx = m.name.find('/psd_tools/')\n        if idx >= 0:\n            m.name = m.name[idx+1:]\n            try: tar.extract(m, tmpdir, set_attrs=False); n+=1\n            except: pass\nprint('Extracted', n, 'files')\nsys.path.insert(0, tmpdir)\nimport psd_tools\nprint('psd_tools', psd_tools.__version__, 'ready')";
var PY_PROCESS="import io, base64\nimport numpy as np\nfrom psd_tools import PSDImage\nfrom psd_tools.constants import Tag\nfrom PIL import Image\nfrom pyodide.http import pyfetch\n\ndef _find(layers, name):\n    for l in layers:\n        if l.name == name: return l\n    return None\n\ndef _get_color(shirt_group):\n    coc = _find(shirt_group, 'Change Object Color')\n    if not coc: return [255,255,255]\n    for layer in coc:\n        if layer.kind == 'solidcolorfill':\n            try:\n                data = layer.tagged_blocks.get_data(Tag.SOLID_COLOR_SHEET_SETTING)\n                clr = data[b'Clr ']\n                return [int(float(clr[b'Rd  '])), int(float(clr[b'Grn '])), int(float(clr[b'Bl  ']))]\n            except: pass\n    return [255,255,255]\n\ndef _get_shirt_mask(base_arr):\n    h,w = base_arr.shape[:2]\n    arr = base_arr.astype(np.float32)\n    r,g,b = arr[:,:,0],arr[:,:,1],arr[:,:,2]\n    lum = (r+g+b)/3\n    bg = np.mean([lum[5,5],lum[5,w-5],lum[h-5,5],lum[h-5,w-5],lum[5,w//2],lum[h//4,5],lum[h//4,w-5]])\n    neutral = (np.abs(r-g)<25)&(np.abs(r-b)<25)&(np.abs(g-b)<25)\n    zone = np.zeros_like(neutral)\n    zone[int(h*0.10):int(h*0.90), int(w*0.05):int(w*0.95)] = True\n    is_shirt = neutral & (lum < bg-40) & (lum > 80) & zone\n    # Row-count filter: only rows with >8% of width\n    min_px = int(w * 0.08)\n    row_counts = is_shirt.sum(axis=1)\n    valid_rows = np.where(row_counts > min_px)[0]\n    if len(valid_rows) == 0: return None, None, bg\n    st, sb = int(valid_rows[0]), int(valid_rows[-1])\n    mask2 = is_shirt.copy(); mask2[:st,:] = False; mask2[sb+1:,:] = False\n    cols = np.where(mask2.any(axis=0))[0]\n    if len(cols) == 0: return None, None, bg\n    bx = (int(cols.min()), st, int(cols.max()), sb)\n    return bx, mask2, bg\n\ndef _apply_color(base_arr, new_color):\n    bx, mask, bg = _get_shirt_mask(base_arr)\n    if mask is None: return base_arr\n    arr = base_arr.astype(np.float32)\n    old_color = np.median(arr[mask], axis=0)\n    result = arr.copy()\n    for c in range(3):\n        ratio = new_color[c] / max(float(old_color[c]), 1.0)\n        result[:,:,c] = np.where(mask, np.clip(arr[:,:,c] * ratio, 0, 255), arr[:,:,c])\n    return result.astype(np.uint8)\n\ndef _paste_stamp(base_img, base_arr, main_obj, stamp):\n    if not stamp: return base_img\n    bx, mask, bg = _get_shirt_mask(base_arr)\n    if bx is None: return base_img\n    sx = (bx[2]-bx[0]) / (main_obj.bbox[2]-main_obj.bbox[0])\n    sy = (bx[3]-bx[1]) / (main_obj.bbox[3]-main_obj.bbox[1])\n    try:\n        si = stamp.composite(viewport=stamp.bbox)\n        if not si: return base_img\n        sa = np.array(si.convert('RGBA'))\n        if (sa[:,:,3]>10).sum() < 50: return base_img\n        dx = stamp.bbox[0]-main_obj.bbox[0]\n        dy = stamp.bbox[1]-main_obj.bbox[1]\n        sw = stamp.bbox[2]-stamp.bbox[0]\n        sh = stamp.bbox[3]-stamp.bbox[1]\n        tx = bx[0]+int(dx*sx); ty = bx[1]+int(dy*sy)\n        tw = max(1,int(sw*sx)); th = max(1,int(sh*sy))\n        si_s = si.convert('RGBA').resize((tw,th), Image.LANCZOS)\n        result = base_img.copy()\n        result.paste(si_s, (tx,ty), si_s.split()[3])\n        return result\n    except Exception as e:\n        print('Stamp error:', e)\n        return base_img\n\ndef _to_jpeg(img, quality=92):\n    buf = io.BytesIO()\n    img.convert('RGB').save(buf, 'JPEG', quality=quality)\n    return 'data:image/jpeg;base64,' + base64.b64encode(buf.getvalue()).decode()\n\nasync def process_psd(raw_bytes):\n    psd = PSDImage.open(io.BytesIO(bytes(raw_bytes)))\n    ls = _find(_find(psd,'Working Process'),'Left Shirt')\n    rs = _find(_find(psd,'Working Process'),'Right Shirt')\n    lm = _find(_find(ls,'Objects'),'Main Object')\n    rm = _find(_find(rs,'Objects'),'Main Object')\n    ef = _find(list(psd),'Estampa Frontal')\n    eb = _find(list(psd),'Estampa Espalda')\n\n    color = _get_color(ls)\n    print('Shirt color:', color)\n\n    # Load fixed base images from Vercel\n    async def load_base(url):\n        resp = await pyfetch(url)\n        data = await resp.bytes()\n        return Image.open(io.BytesIO(bytes(data))).convert('RGB')\n\n    base_f = await load_base('/base_frente.jpg')\n    base_b = await load_base('/base_espalda.jpg')\n    bf_arr = np.array(base_f)\n    bb_arr = np.array(base_b)\n\n    # Apply color\n    front_arr = _apply_color(bf_arr, color)\n    back_arr  = _apply_color(bb_arr, color)\n    front_img = Image.fromarray(front_arr)\n    back_img  = Image.fromarray(back_arr)\n\n    # Paste stamps\n    front_img = _paste_stamp(front_img, bf_arr, lm, ef)\n    back_img  = _paste_stamp(back_img,  bb_arr, rm, eb)\n\n    return _to_jpeg(front_img), _to_jpeg(back_img)\n";

var MASK_F="38baaeb1c16f4ec1ab994b94b69820f0",MASK_B="03b2ad6a11a44c7283e7cfac5e2733d5";
var MAX_DIM=1400,LY1=1004,LY2=1040,LX1=1083,LX2=1235;
var frontDataUrl=null,backDataUrl=null,pyodide=null,pyPromise=null;

function st(msg,err){var el=document.getElementById("status");el.textContent=msg;el.className=err?"err":"";}

async function loadPy(){
  if(pyodide)return pyodide;
  if(pyPromise)return pyPromise;
  pyPromise=(async function(){
    st("Cargando Python (primera vez ~30s)...");
    var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js";document.head.appendChild(s);
    await new Promise(function(res,rej){s.onload=res;s.onerror=function(){rej(new Error("Pyodide no cargo"));};});
    var py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"});
    st("Cargando numpy y pillow...");
    await py.loadPackage(["pillow","numpy","attrs","scipy"]);
    st("Configurando entorno...");
    await py.runPythonAsync(PY_SETUP);
    st("Descargando psd-tools (235KB)...");
    await py.runPythonAsync(PY_INSTALL);
    pyodide=py; st("Motor Python listo"); return py;
  })();
  return pyPromise;
}

async function processPSD(file){
  var py=await loadPy();
  var buf=await file.arrayBuffer();
  py.globals.set("_raw",py.toPy(new Uint8Array(buf)));
  await py.runPythonAsync(PY_PROCESS);
  var res=await py.runPythonAsync("await process_psd(_raw)");
  var arr=res.toJs();
  return{front:arr[0],back:arr[1]};
}

function findL(list,name){for(var i=0;i<(list||[]).length;i++)if(list[i].name===name)return list[i];return null;}
function findN(root){var cur=root;for(var i=1;i<arguments.length;i++){cur=findL(cur&&cur.children,arguments[i]);if(!cur)return null;}return cur;}
function rsz(src){var w=src.width,h=src.height;if(w<=MAX_DIM&&h<=MAX_DIM)return src;var s=MAX_DIM/Math.max(w,h),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;}
function quickPreview(buf){
  try{
    var psd=agPsd.readPsd(buf,{skipLayerImageData:false,useRawThumbnail:false});
    var lM=findN(psd,"Working Process","Left Shirt","Objects","Main Object");
    var rM=findN(psd,"Working Process","Right Shirt","Objects","Main Object");
    function crop(m){if(!m||!m.canvas)return null;var c=document.createElement("canvas");c.width=m.right-m.left;c.height=m.bottom-m.top;var ctx=c.getContext("2d");ctx.fillStyle="#ddd";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(m.canvas,0,0);return rsz(c);}
    var fc=crop(lM),bc=crop(rM);
    return{front:fc?fc.toDataURL("image/jpeg",.85):null,back:bc?bc.toDataURL("image/jpeg",.85):null};
  }catch(e){return{front:null,back:null};}
}

async function onFile(file){
  if(!file)return;
  document.getElementById("gen-btn").disabled=true;
  frontDataUrl=null; backDataUrl=null;
  try{
    st("Leyendo PSD...");
    var buf=await file.arrayBuffer();
    var prev=quickPreview(buf);
    if(prev.front)document.getElementById("preview-front").src=prev.front;
    if(prev.back)document.getElementById("preview-back").src=prev.back;
    if(prev.front||prev.back)document.getElementById("preview-row").style.display="flex";
    st("Procesando con Python (primera vez ~40s)...");
    var res=await processPSD(file);
    frontDataUrl=res.front; backDataUrl=res.back;
    document.getElementById("preview-front").src=frontDataUrl;
    document.getElementById("preview-back").src=backDataUrl;
    document.getElementById("preview-row").style.display="flex";
    document.getElementById("gen-btn").disabled=false;
    st("Listo");
  }catch(err){console.error(err);st("Error: "+err.message,true);}
}

function detectOff(d,w,h){
  var sum=0,n=0;
  for(var px of[5,w-5,5,w-5]){for(var py of[5,5,15,15]){var i=(py*w+px)*4;sum+=(d[i]+d[i+1]+d[i+2])/3;n++;}}
  var bg=sum/n, cs=[];
  for(var y=Math.floor(h*.45);y<Math.floor(h*.80);y+=10){
    var l=-1,r=-1;
    for(var x=0;x<w;x++){var i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-bg)>20){l=x;break;}}
    for(var x=w-1;x>=0;x--){var i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-bg)>20){r=x;break;}}
    if(l>-1&&r>l&&(r-l)>w*.25&&(r-l)<w*.92)cs.push((l+r)/2);
  }
  if(cs.length<4)return 0;
  cs.sort(function(a,b){return a-b;});
  var o=Math.round(cs[Math.floor(cs.length/2)]-w/2);
  if(Math.abs(o)<10)return 0;
  if(Math.abs(o)>220)return 0;
  return o;
}
function center(canvas,ctx,off){
  if(!off)return;
  var w=canvas.width,h=canvas.height;
  var tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;
  tmp.getContext("2d").drawImage(canvas,0,0);
  ctx.clearRect(0,0,w,h);
  if(off>0){ctx.drawImage(tmp,w-3,0,3,h,w-off,0,off,h);}
  else{ctx.drawImage(tmp,0,0,3,h,0,0,-off,h);}
  ctx.drawImage(tmp,-off,0);
}
function removeArt(id,y1,y2,x1,x2){
  var d=id.data,w=id.width,h=id.height,rows=15,above=[],below=[];
  for(var x=x1;x<x2;x++){
    var r=0,g=0,b=0,n=0;
    for(var y=Math.max(0,y1-rows);y<y1;y++){var i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    above.push(n?[r/n,g/n,b/n]:[230,230,230]);r=g=b=n=0;
    for(var y=y2;y<Math.min(h,y2+rows);y++){var i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    below.push(n?[r/n,g/n,b/n]:[230,230,230]);
  }
  for(var row=0;row<y2-y1;row++){
    var t=(y2-y1)>1?row/(y2-y1-1):0;
    for(var col=0;col<x2-x1;col++){
      var i=((y1+row)*w+(x1+col))*4;
      d[i]=Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1]=Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2]=Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return id;
}
async function postProcess(imgUrl,isFront){
  return new Promise(function(resolve,reject){
    var img=new Image();img.crossOrigin="anonymous";
    img.onerror=function(){reject(new Error("No se pudo cargar imagen"));};
    img.onload=function(){
      var c=document.getElementById("work-canvas");c.width=img.width;c.height=img.height;
      var ctx=c.getContext("2d");ctx.drawImage(img,0,0);
      center(c,ctx,detectOff(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height));
      if(isFront){
        var id=ctx.getImageData(0,0,c.width,c.height);id=removeArt(id,LY1,LY2,LX1,LX2);ctx.putImageData(id,0,0);
        var ci=ctx.getImageData(0,0,c.width,c.height);var cw=c.width,ch=c.height;
        var cf=(ci.data[20*4]+ci.data[20*4+1]+ci.data[20*4+2])/3*.5+(ci.data[(20*cw+(cw-20))*4]+ci.data[(20*cw+(cw-20))*4+1]+ci.data[(20*cw+(cw-20))*4+2])/3*.5;
        var edges=[];
        for(var sy=Math.floor(ch*.52);sy<Math.floor(ch*.60);sy+=4)
          for(var sx=cw-1;sx>=cw/2;sx--){var si=(sy*cw+sx)*4;if(Math.abs((ci.data[si]+ci.data[si+1]+ci.data[si+2])/3-cf)>18){edges.push(sx);break;}}
        edges.sort(function(a,b){return a-b;});
        var se=edges.length?edges[Math.floor(edges.length/2)]:cw-80;
        var g=new Image();
        g.onload=function(){ctx.drawImage(g,se-g.width,Math.floor(ch*.555));resolve(c.toDataURL("image/jpeg",.95));};
        g.onerror=function(){resolve(c.toDataURL("image/jpeg",.95));};
        g.src=GRIFA;
      }else{resolve(c.toDataURL("image/jpeg",.95));}
    };img.src=imgUrl;
  });
}
async function apiPost(q,body){var res=await fetch("/api/topview?"+q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});var txt=await res.text();try{return JSON.parse(txt);}catch(e){throw new Error("HTTP "+res.status+": "+txt.slice(0,300));}}
async function apiGet(q){var res=await fetch("/api/topview?"+q);var txt=await res.text();try{return JSON.parse(txt);}catch(e){throw new Error("HTTP "+res.status+": "+txt.slice(0,300));}}
async function upload(b64){var d=await apiPost("upload=1",{imageBase64:b64});if(!d.ok)throw new Error("Upload: "+(d.error||JSON.stringify(d)));return d.fileId;}
async function submitTask(p,t,m){var d=await apiPost("submit=1",{productImageFileId:p,templateImageFileId:t,templateMaskFileId:m});if(!d.ok)throw new Error("Submit: "+(d.error||JSON.stringify(d)));return d.taskId;}
async function poll(taskId,cb){
  for(var i=0;i<40;i++){
    await new Promise(function(r){setTimeout(r,3000);});var d;
    try{d=await apiGet("query="+encodeURIComponent(taskId));}catch(e){console.warn("poll",e);continue;}
    if(d.code!=="200")throw new Error("TopView: "+JSON.stringify(d).slice(0,300));
    var r=d.result||d,s=r.status||"?";if(cb)cb(s,i);
    if(s==="success"){var imgs=r.anyfitImages||[];var url=imgs[0]&&imgs[0].url;if(!url)throw new Error("Sin URL");return url;}
    if(s==="fail"||s==="failed")throw new Error("Fallida: "+(r.errorMsg||"?"));
  }
  throw new Error("Timeout.");
}

}
