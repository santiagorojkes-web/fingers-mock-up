<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:40px 20px}
header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
.logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.upload-area{max-width:640px;margin:0 auto 32px;border:1px dashed #2a2a2a;border-radius:4px;padding:48px;text-align:center}
.upload-area.active{border-color:var(--accent)}
.upload-icon{font-size:32px;opacity:.3;margin-bottom:12px}
.upload-title{font-size:13px;color:var(--gray);margin-bottom:8px}
.upload-hint{font-size:11px;color:#404040}
.upload-btn{display:inline-block;margin-top:16px;padding:10px 28px;background:var(--accent);color:#000;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.upload-btn:hover{background:#d4ff33}
#file-input{display:none}
.preview-box{flex:1}
.preview-img{aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-img img{width:100%;height:100%;object-fit:contain}
.preview-lbl{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.gen-btn{display:block;margin:0 auto 32px;background:var(--accent);color:#000;border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.gen-btn:disabled{opacity:.3;cursor:not-allowed}
#status{text-align:center;font-size:12px;color:var(--gray);min-height:20px;margin-bottom:32px;padding:0 20px}
#status.err{color:#ff5555}
#results{display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto}
.result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.result-card img{width:100%;display:block}
.result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.dl-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></header>
<div class="upload-area" id="drop-zone">
  <div class="upload-icon">&#8853;</div>
  <div class="upload-title">Subir archivo PSD</div>
  <div class="upload-hint">Soporta todo tipo de capas</div>
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">Seleccionar archivo</button>
  <input type="file" id="file-input" accept=".psd">
</div>
<div id="preview-row" style="display:none;flex-direction:row;gap:16px;max-width:640px;margin:0 auto 28px">
  <div class="preview-box"><div class="preview-img"><img id="preview-front" src="" alt="Frente"></div><div class="preview-lbl">Frente</div></div>
  <div class="preview-box"><div class="preview-img"><img id="preview-back" src="" alt="Espalda"></div><div class="preview-lbl">Espalda</div></div>
</div>
<button class="gen-btn" id="gen-btn" disabled onclick="generate()">Generar Mockup</button>
<div id="status"></div>
<div id="results" style="display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto">
  <div class="result-card"><img id="result-front" src="" alt="Frente">
    <div class="result-footer"><span class="result-title">Frente</span><a class="dl-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a></div>
  </div>
  <div class="result-card"><img id="result-back" src="" alt="Espalda">
    <div class="result-footer"><span class="result-title">Espalda</span><a class="dl-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a></div>
  </div>
</div>
<canvas id="work-canvas" style="display:none"></canvas>
<script>

var PY_SETUP="import sys, io, tarfile, tempfile, types, re\nimport numpy as np\nfrom PIL import Image, ImageDraw\n\nclass _PBMod(types.ModuleType): pass\n_pb = _PBMod('packbits')\ndef _pb_decode(data, size=None):\n    if hasattr(data,'tobytes'): data=data.tobytes()\n    if not isinstance(data,(bytes,bytearray)): data=bytes(data)\n    r=bytearray(); i=0\n    while i<len(data):\n        b=data[i]; i+=1\n        if b<128:\n            n=b+1; r.extend(data[i:i+n]); i+=n\n        elif b>128:\n            n=257-b\n            if i<len(data): r.extend([data[i]]*n); i+=1\n    return bytes(r)\n_pb.decode=_pb_decode\n_pb.encode=lambda d,**kw: bytes(d) if not isinstance(d,bytes) else d\nsys.modules['packbits']=_pb\n\ndef _bezier(p0,p1,p2,p3,n=20):\n    t=np.linspace(0,1,n)\n    return (((1-t)**3)[:,None]*p0+(3*(1-t)**2*t)[:,None]*p1+\n            (3*(1-t)*t**2)[:,None]*p2+(t**3)[:,None]*p3).tolist()\n\ndef _parse_svg_path(pathd):\n    pts=[]; cx=cy=0.0; toks=str(pathd).split(); i=0\n    while i<len(toks):\n        t=toks[i]\n        if t=='M':\n            i+=1\n            if i+1<len(toks):\n                try: cx,cy=float(toks[i]),float(toks[i+1]); pts.append((cx,cy)); i+=2\n                except ValueError: i+=1\n        elif t=='C':\n            i+=1\n            while i+5<len(toks):\n                try:\n                    p1x,p1y=float(toks[i]),float(toks[i+1])\n                    p2x,p2y=float(toks[i+2]),float(toks[i+3])\n                    ex,ey  =float(toks[i+4]),float(toks[i+5])\n                    for p in _bezier(np.array([cx,cy]),np.array([p1x,p1y]),np.array([p2x,p2y]),np.array([ex,ey])): pts.append((p[0],p[1]))\n                    cx,cy=ex,ey; i+=6\n                except (ValueError,IndexError): break\n        elif t in ('Z','z'): i+=1\n        else: i+=1\n    return pts\n\nclass _Draw:\n    def __init__(self,image):\n        self._img=image; self._imd=ImageDraw.Draw(image); self._mode=image.mode\n    def symbol(self,xy,sym,pen=None,brush=None):\n        if sym is None or not hasattr(sym,'_pts') or not sym._pts or len(sym._pts)<3: return\n        x=xy[0] if isinstance(xy,(list,tuple)) else xy\n        y=xy[1] if isinstance(xy,(list,tuple)) else 0\n        if self._mode=='L':\n            c=brush._color if brush else 255\n            c=c if isinstance(c,int) else int(sum(c[:3])/3) if isinstance(c,(list,tuple)) else 255\n        else:\n            c=brush._color if brush else (0,0,0,255)\n        flat=[(p[0]+x,p[1]+y) for p in sym._pts]\n        if len(flat)>=3:\n            try: self._imd.polygon(flat,fill=c)\n            except: pass\n    def flush(self): pass\nclass _Symbol:\n    def __init__(self,pathd,scale=None): self._pts=_parse_svg_path(pathd)\nclass _Pen:\n    def __init__(self,color='black',width=1): self._color=color if isinstance(color,int) else (0,0,0)\nclass _Brush:\n    def __init__(self,color='black'):\n        if isinstance(color,int): self._color=color\n        elif isinstance(color,str):\n            try:\n                from PIL import ImageColor; self._color=ImageColor.getrgb(color)\n            except: self._color=(0,0,0)\n        elif isinstance(color,(list,tuple)): self._color=tuple(color)\n        else: self._color=(0,0,0)\nagg=types.ModuleType('aggdraw')\nagg.Draw=_Draw; agg.Symbol=_Symbol; agg.Pen=_Pen; agg.Brush=_Brush\nsys.modules['aggdraw']=agg\nfor _m in ['docopt','colormath','colormath.color_objects','colormath.color_conversions','colormath.color_diff']:\n    sys.modules.setdefault(_m,types.ModuleType(_m))\n\nfrom PIL import ImageFilter as _IF\ndef _gaussian(img,sigma=1,**kw):\n    if isinstance(img,np.ndarray):\n        mx=img.max(); sc=255. if mx<=1 else 1.\n        pil=Image.fromarray((img*255).astype(np.uint8) if mx<=1 else img.astype(np.uint8))\n        r=pil.filter(_IF.GaussianBlur(radius=float(sigma)))\n        return np.array(r).astype(np.float32)/sc\n    return img\ndef _disk(radius):\n    d=int(radius*2+1); a=np.zeros((d,d),np.uint8); c=d//2\n    for y in range(d):\n        for x in range(d):\n            if (y-c)**2+(x-c)**2<=radius**2: a[y,x]=1\n    return a\ndef _resize(img,output_shape,**kw):\n    if isinstance(img,np.ndarray):\n        h,w=output_shape[:2]; mx=img.max(); sc=255. if mx<=1 else 1.\n        pil=Image.fromarray((img*255).astype(np.uint8) if mx<=1 else img.astype(np.uint8))\n        return np.array(pil.resize((w,h),Image.LANCZOS)).astype(np.float32)/sc\n    return img\n_sk=types.ModuleType('skimage'); _skf=types.ModuleType('skimage.filters')\n_skm=types.ModuleType('skimage.morphology'); _skt=types.ModuleType('skimage.transform')\n_skf.gaussian=_gaussian; _skm.disk=_disk; _skt.resize=_resize\n_sk.filters=_skf; _sk.morphology=_skm; _sk.transform=_skt\nsys.modules.update({'skimage':_sk,'skimage.filters':_skf,'skimage.morphology':_skm,'skimage.transform':_skt})\nprint('mocks OK')";
var PY_INSTALL="import sys, io, tarfile, tempfile\nfrom pyodide.http import pyfetch\nprint('Downloading psd-tools sdist...')\nresp = await pyfetch('https://files.pythonhosted.org/packages/5c/fc/29b0d2fb9e0fadf214b7ce6b236449f374393d1bec0b52efb68400f373bc/psd_tools-1.9.34.tar.gz')\ndata = await resp.bytes()\nprint('Downloaded', len(data), 'bytes')\ntmpdir = tempfile.mkdtemp()\nwith tarfile.open(fileobj=io.BytesIO(bytes(data)), mode='r:gz') as tar:\n    n=0\n    for m in tar.getmembers():\n        idx = m.name.find('/psd_tools/')\n        if idx >= 0:\n            m.name = m.name[idx+1:]\n            try: tar.extract(m, tmpdir, set_attrs=False); n+=1\n            except: pass\nprint('Extracted', n, 'files')\nsys.path.insert(0, tmpdir)\nimport psd_tools\nprint('psd_tools', psd_tools.__version__, 'ready')";
var PY_PROCESS="import io, base64\nimport numpy as np\nfrom psd_tools import PSDImage\nfrom psd_tools.constants import Tag\nfrom PIL import Image\n\ndef _find(layers, name):\n    for l in layers:\n        if l.name == name: return l\n    return None\n\ndef _get_shirt_color(shirt_group):\n    coc = _find(shirt_group, 'Change Object Color')\n    if not coc: return [255,255,255]\n    for layer in coc:\n        if layer.kind == 'solidcolorfill':\n            try:\n                data = layer.tagged_blocks.get_data(Tag.SOLID_COLOR_SHEET_SETTING)\n                clr = data[b'Clr ']\n                return [int(float(clr[b'Rd  '])), int(float(clr[b'Grn '])), int(float(clr[b'Bl  ']))]\n            except: pass\n    return [255,255,255]\n\ndef _to_jpeg(img, max_dim=1400, quality=92):\n    w, h = img.size\n    if max(w, h) > max_dim:\n        s = max_dim / max(w, h)\n        img = img.resize((round(w*s), round(h*s)), Image.LANCZOS)\n    rgb = Image.new('RGB', img.size, (255, 255, 255))\n    if img.mode == 'RGBA': rgb.paste(img, mask=img.split()[3])\n    else: rgb.paste(img)\n    buf = io.BytesIO()\n    rgb.save(buf, 'JPEG', quality=quality)\n    return 'data:image/jpeg;base64,' + base64.b64encode(buf.getvalue()).decode()\n\ndef process_psd(raw_bytes):\n    psd = PSDImage.open(io.BytesIO(bytes(raw_bytes)))\n    l_shirt = _find(_find(psd, 'Working Process'), 'Left Shirt')\n    r_shirt = _find(_find(psd, 'Working Process'), 'Right Shirt')\n    l_main  = _find(_find(l_shirt, 'Objects'), 'Main Object')\n    r_main  = _find(_find(r_shirt, 'Objects'), 'Main Object')\n    e_front = _find(list(psd), 'Estampa Frontal')\n    e_back  = _find(list(psd), 'Estampa Espalda')\n    grifa   = _find(list(psd), 'Grifa Frente')\n\n    def build(shirt_group, main_obj, stamp):\n        color = _get_shirt_color(shirt_group)\n        shirt = main_obj.topil().convert('RGBA')\n        arr = np.array(shirt).astype(np.float32)\n        alpha = arr[:,:,3]; mask = alpha > 10\n        for c in range(3):\n            ch = arr[:,:,c]\n            m = mask & (ch > 80)\n            if m.sum() > 0:\n                mn,mx = float(ch[m].min()), float(ch[m].max())\n                if mx > mn: ch[m] = 185 + (ch[m]-mn)/(mx-mn)*70\n            arr[:,:,c] = ch\n        for c in range(3):\n            arr[:,:,c][mask] = np.clip(arr[:,:,c][mask] * color[c]/255, 0, 255)\n        result = Image.fromarray(arr.astype(np.uint8))\n        if stamp:\n            try:\n                si = stamp.composite(viewport=stamp.bbox)\n                if si:\n                    sa = np.array(si.convert('RGBA'))\n                    if (sa[:,:,3]>10).sum() > 50:\n                        sx = stamp.bbox[0] - main_obj.bbox[0]\n                        sy = stamp.bbox[1] - main_obj.bbox[1]\n                        result.paste(si.convert('RGBA'), (sx, sy), si.convert('RGBA'))\n            except: pass\n        return result\n\n    front_img = build(l_shirt, l_main, e_front)\n    if grifa and l_main:\n        try:\n            gx = grifa.left - l_main.left; gy = grifa.top - l_main.top\n            gw = grifa.right - grifa.left; gh = grifa.bottom - grifa.top\n            sc = front_img.getpixel((max(0, gx-10), max(0, gy+gh//2)))\n            fill = Image.new('RGBA', (gw+8, gh+8), (sc[0], sc[1], sc[2], 255))\n            front_img.paste(fill, (max(0, gx-4), max(0, gy-4)))\n        except: pass\n    back_img = build(r_shirt, r_main, e_back)\n    return _to_jpeg(front_img), _to_jpeg(back_img)"
