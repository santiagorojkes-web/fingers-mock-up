<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --white: #f5f5f5;
    --gray: #888;
    --accent: #c8ff00;
    --border: #222;
  }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 40px;
  }
  .logo {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .subtitle { font-size: 11px; color: var(--gray); letter-spacing: 0.1em; text-transform: uppercase; }
  
  .upload-zone {
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    max-width: 600px;
    margin: 0 auto 40px;
    position: relative;
  }
  .upload-zone:hover { border-color: var(--accent); }
  .upload-zone.drag-over { border-color: var(--accent); background: rgba(200,255,0,0.03); }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .upload-label { font-size: 13px; color: var(--gray); letter-spacing: 0.05em; }
  .upload-hint { font-size: 11px; color: #555; margin-top: 8px; }

  #preview-row {
    display: none;
    gap: 16px;
    max-width: 600px;
    margin: 0 auto 32px;
  }
  .preview-half {
    flex: 1;
    aspect-ratio: 1;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-half img { width: 100%; height: 100%; object-fit: contain; }
  .preview-label { font-size: 10px; color: var(--gray); text-align: center; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px; }

  .generate-btn {
    display: block;
    margin: 0 auto 40px;
    background: var(--accent);
    color: var(--black);
    border: none;
    padding: 14px 48px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .generate-btn:hover { background: #d4ff33; }
  .generate-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #status {
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    letter-spacing: 0.08em;
    min-height: 20px;
    margin-bottom: 32px;
  }
  #status.error { color: #ff5555; }
  #status .dot {
    display: inline-block;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  #results {
    display: none;
    max-width: 800px;
    margin: 0 auto;
    gap: 32px;
  }
  .result-card {
    background: #111;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .result-card img { width: 100%; display: block; }
  .result-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .result-title { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); }
  .download-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--white);
    padding: 6px 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-decoration: none;
  }
  .download-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Fingers Crossed</div>
    <div class="subtitle">Mockup Generator</div>
  </div>
</header>

<div class="upload-zone" id="drop-zone">
  <input type="file" id="file-input" accept="image/*">
  <div class="upload-icon">⊕</div>
  <div class="upload-label">Subir imagen de remera</div>
  <div class="upload-hint">Frente a la izquierda · Espalda a la derecha</div>
</div>

<div id="preview-row">
  <div>
    <div class="preview-half"><img id="preview-front" /></div>
    <div class="preview-label">Frente</div>
  </div>
  <div>
    <div class="preview-half"><img id="preview-back" /></div>
    <div class="preview-label">Espalda</div>
  </div>
</div>

<button class="generate-btn" id="generate-btn" disabled>Generar Mockup</button>

<div id="status"></div>

<div id="results">
  <div class="result-card">
    <img id="result-front" />
    <div class="result-footer">
      <span class="result-title">Frente</span>
      <a class="download-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a>
    </div>
  </div>
  <div class="result-card">
    <img id="result-back" />
    <div class="result-footer">
      <span class="result-title">Espalda</span>
      <a class="download-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a>
    </div>
  </div>
</div>

<canvas id="work-canvas" style="display:none"></canvas>

// ─── CANVAS POST-PROCESSING ────────────────────────────────────────

function removeArtifactInterpolate(ctx, imgData, y1, y2, x1, x2, sampleRows = 15) {
  const w = imgData.width;
  const d = imgData.data;

  // Sample average color above (per column)
  const above = [];
  for (let x = x1; x < x2; x++) {
    let r=0, g=0, b=0, count=0;
    for (let y = Math.max(0, y1-sampleRows); y < y1; y++) {
      const idx = (y * w + x) * 4;
      r += d[idx]; g += d[idx+1]; b += d[idx+2]; count++;
    }
    above.push(count ? [r/count, g/count, b/count] : [230,230,230]);
  }

  // Sample average color below (per column)
  const below = [];
  for (let x = x1; x < x2; x++) {
    let r=0, g=0, b=0, count=0;
    for (let y = y2; y < Math.min(imgData.height, y2+sampleRows); y++) {
      const idx = (y * w + x) * 4;
      r += d[idx]; g += d[idx+1]; b += d[idx+2]; count++;
    }
    below.push(count ? [r/count, g/count, b/count] : [230,230,230]);
  }

  // Interpolate
  const h = y2 - y1;
  for (let row = 0; row < h; row++) {
    const t = h > 1 ? row / (h - 1) : 0;
    for (let col = 0; col < (x2 - x1); col++) {
      const x = x1 + col;
      const y = y1 + row;
      const idx = (y * w + x) * 4;
      d[idx]   = Math.round(above[col][0] * (1-t) + below[col][0] * t);
      d[idx+1] = Math.round(above[col][1] * (1-t) + below[col][1] * t);
      d[idx+2] = Math.round(above[col][2] * (1-t) + below[col][2] * t);
    }
  }

  return imgData;
}

async function postProcessFront(imageUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = async () => {
      const canvas = document.getElementById('work-canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      // 1. Remover etiqueta interna del cuello
      let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      imgData = removeArtifactInterpolate(imgData, 
        POST.LABEL.y1, POST.LABEL.y2, POST.LABEL.x1, POST.LABEL.x2, POST.LABEL.sample);
      ctx.putImageData(imgData, 0, 0);

      // 2. Añadir grifa en manga
      const grifaImg = new Image();
      grifaImg.onload = () => {
        ctx.drawImage(grifaImg, POST.GRIFA_FRONT.x, POST.GRIFA_FRONT.y);
        resolve(canvas.toDataURL('image/jpeg', 0.95));
      };
      grifaImg.onerror = reject;
      grifaImg.src = GRIFA_DATA_URL;
    };
    img.onerror = reject;
    img.src = imageUrl;
  });
}

async function postProcessBack(imageUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const canvas = document.getElementById('work-canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      // Remover grifa de la manga
      let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      imgData = removeArtifactInterpolate(imgData,
        POST.GRIFA_BACK.y1, POST.GRIFA_BACK.y2, POST.GRIFA_BACK.x1, POST.GRIFA_BACK.x2, POST.GRIFA_BACK.sample);
      ctx.putImageData(imgData, 0, 0);

      resolve(canvas.toDataURL('image/jpeg', 0.95));
    };
    img.onerror = reject;
    img.src = imageUrl;
  });
}

// ─── IMAGE SPLITTING ────────────────────────────────────────────────

function splitImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const halfW = Math.floor(img.width / 2);
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      
      tempCanvas.width = halfW; tempCanvas.height = img.height;
      tempCtx.drawImage(img, 0, 0);
      const frontBlob = tempCanvas.toDataURL('image/jpeg', 0.95);
      
      tempCtx.clearRect(0, 0, halfW, img.height);
      tempCtx.drawImage(img, -halfW, 0);
      const backBlob = tempCanvas.toDataURL('image/jpeg', 0.95);
      
      URL.revokeObjectURL(url);
      resolve({ front: frontBlob, back: backBlob, w: halfW, h: img.height });
    };
    img.src = url;
  });
}

async function tvFetch(path, body) {
  const res = await fetch(`/api/topview?path=${encodeURIComponent(path)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function uploadImage(base64DataUrl) {
  // Convert data URL to base64 string only
  const base64 = base64DataUrl.split(',')[1];
  const resp = await tvFetch('/api/open/v1/file/upload', { imageBase64: base64 });
  if (resp.code !== 0) throw new Error('Upload failed: ' + JSON.stringify(resp));
  return resp.data.fileId;
}

async function createModelTask(productFileId, templateFileId, maskFileId) {
  const resp = await tvFetch('/api/open/v3/product/model/create', {
    productFileId,
    templateFileId,
    maskFileId,
  });
  if (resp.code !== 0) throw new Error('Task creation failed: ' + JSON.stringify(resp));
  return resp.data.taskId;
}

async function pollTask(taskId, maxAttempts = 60) {
  for (let i = 0; i < maxAttempts; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const resp = await tvFetch('/api/open/v3/product/model/query', { taskId });
    if (resp.code !== 0) throw new Error('Query failed: ' + JSON.stringify(resp));
    const { status, resultUrl } = resp.data;
    if (status === 'success') return resultUrl;
    if (status === 'failed') throw new Error('Task failed: ' + JSON.stringify(resp));
  }
  throw new Error('Timeout');
}

// ─── MAIN FLOW ───────────────────────────────────────────────────────

let currentFile = null;

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

async function generate() {
  if (!currentFile) return;
  
  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  document.getElementById('results').style.display = 'none';

  try {
    setStatus('Cortando imagen ●');
    const { front: frontData, back: backData } = await splitImage(currentFile);

    setStatus('Subiendo imágenes a TopView ●');
    const [frontFileId, backFileId] = await Promise.all([
      uploadImage(frontData),
      uploadImage(backData)
    ]);

    setStatus('Generando mockup frente ●');
    const frontTaskId = await createModelTask(frontFileId, TEMPLATE_FRONT_FILE_ID, MASK_FRONT_FILE_ID);
    
    setStatus('Generando mockup espalda ●');
    const backTaskId = await createModelTask(backFileId, TEMPLATE_BACK_FILE_ID, MASK_BACK_FILE_ID);

    setStatus('Procesando (puede tardar ~30s) ●');
    const [frontUrl, backUrl] = await Promise.all([
      pollTask(frontTaskId),
      pollTask(backTaskId)
    ]);

    setStatus('Aplicando post-proceso ●');
    
    // Fetch images via proxy (CORS)
    const [frontProcessed, backProcessed] = await Promise.all([
      postProcessFront(`/api/topview?proxy=${encodeURIComponent(frontUrl)}`),
      postProcessBack(`/api/topview?proxy=${encodeURIComponent(backUrl)}`)
    ]);

    // Display
    const resultFront = document.getElementById('result-front');
    const resultBack  = document.getElementById('result-back');
    resultFront.src = frontProcessed;
    resultBack.src  = backProcessed;

    document.getElementById('dl-front').href = frontProcessed;
    document.getElementById('dl-back').href  = backProcessed;
    document.getElementById('results').style.display = 'grid';

    setStatus('✓ Listo');
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message, true);
  }

  btn.disabled = false;
}

// ─── UI EVENTS ──────────────────────────────────────────────────────

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;

  // Show split preview
  const { front, back } = await splitImage(file);
  document.getElementById('preview-front').src = front;
  document.getElementById('preview-back').src = back;
  const pr = document.getElementById('preview-row');
  pr.style.display = 'flex';
  document.getElementById('generate-btn').disabled = false;
  setStatus('');
});

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  document.getElementById('file-input').files = e.dataTransfer.files;
  document.getElementById('file-input').dispatchEvent(new Event('change'));
});

document.getElementById('generate-btn').addEventListener('click', generate);
</script>
