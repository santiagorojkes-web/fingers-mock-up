<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:40px 20px}
header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
.logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.upload-area{max-width:640px;margin:0 auto 32px;border:1px dashed #2a2a2a;border-radius:4px;padding:48px;text-align:center}
.upload-area.active{border-color:var(--accent)}
.upload-icon{font-size:32px;opacity:.3;margin-bottom:12px}
.upload-title{font-size:13px;color:var(--gray);margin-bottom:8px}
.upload-hint{font-size:11px;color:#404040}
.upload-btn{display:inline-block;margin-top:16px;padding:10px 28px;background:var(--accent);color:#000;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.upload-btn:hover{background:#d4ff33}
#file-input{display:none}
#preview-row{display:none;gap:16px;max-width:640px;margin:0 auto 28px}
.preview-box{flex:1}
.preview-img{aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-img img{width:100%;height:100%;object-fit:contain}
.preview-lbl{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.gen-btn{display:block;margin:0 auto 32px;background:var(--accent);color:#000;border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.gen-btn:disabled{opacity:.3;cursor:not-allowed}
#status{text-align:center;font-size:12px;color:var(--gray);min-height:20px;margin-bottom:32px;padding:0 20px}
#status.err{color:#ff5555}
#results{display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto}
.result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.result-card img{width:100%;display:block}
.result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.dl-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>

<body>
<header><div class="logo">Fingers Crossed</div><div class="subtitle">Mockup Generator</div></header>

<div class="upload-area" id="drop-zone">
  <div class="upload-icon">⊕</div>
  <div class="upload-title">Subir archivo PSD</div>
  <div class="upload-hint">Soporta todo tipo de capas</div>
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">Seleccionar archivo</button>
  <input type="file" id="file-input" accept=".psd">
</div>

<div id="preview-row" style="display:none;flex-direction:row;gap:16px;max-width:640px;margin:0 auto 28px">

</div>

<button class="gen-btn" id="gen-btn" disabled onclick="generate()">Generar Mockup</button>
<div id="status"></div>

    <div class="result-footer"><span class="result-title">Frente</span><a class="dl-btn" id="dl-front" download="mockup_frente.jpg">Descargar</a></div>
  </div>
  <div class="result-card"><img id="result-back" src="" alt="Espalda">
    <div class="result-footer"><span class="result-title">Espalda</span><a class="dl-btn" id="dl-back" download="mockup_espalda.jpg">Descargar</a></div>
  </div>
</div>
<canvas id="work-canvas" style="display:none"></canvas>

<script>

const TMPL_F = '7d7621e822644dd6ad2a997c4c71c609';
const TMPL_B = '6a4e9340ec364a60a75bf22cd13604ae';
const MASK_F = '38baaeb1c16f4ec1ab994b94b69820f0';
const MASK_B = '03b2ad6a11a44c7283e7cfac5e2733d5';
const MAX_DIM = 1400;
const LABEL  = {y1:1004,y2:1040,x1:1083,x2:1235};

let frontDataUrl = null, backDataUrl = null;
let pyodide = null, pyPromise = null;

function st(msg, err=false) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = err ? 'err' : '';

// ── Pyodide ──────────────────────────────────────────────────────
async function loadPy() {
  if (pyodide) return pyodide;
  if (pyPromise) return pyPromise;
  pyPromise = (async () => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
    document.head.appendChild(s);
    await new Promise((res, rej) => { s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar Pyodide')); });
    const py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/' });
    await py.loadPackage(['micropip', 'pillow', 'numpy']);
    await py.runPythonAsync(`import micropip
await micropip.install('psd-tools', keep_going=True)`);
    pyodide = py;
    return py;
  })();
  return pyPromise;
}

// ── Python PSD code ───────────────────────────────────────────────
// psd-tools renderiza el PSD exactamente como Photoshop:
// shirt_group.composite() = frente o espalda con color + estampas + sombras
const PY = `
import io, base64
import numpy as np
from psd_tools import PSDImage
from PIL import Image

def find_layer(layers, name):
    for l in layers:
        if l.name == name: return l
    return None

def find_nested(root, *path):
    cur = root
    for s in path:
        cur = find_layer(cur, s)
        if not cur: return None
    return cur

def to_jpeg_b64(img, max_dim=1400, quality=92):
    w, h = img.size
    if max(w, h) > max_dim:
        s = max_dim / max(w, h)
        img = img.resize((round(w*s), round(h*s)), Image.LANCZOS)
    rgb = Image.new('RGB', img.size, (255, 255, 255))
    if img.mode == 'RGBA':
        rgb.paste(img, mask=img.split()[3])
    else:
        rgb.paste(img)
    buf = io.BytesIO()
    rgb.save(buf, 'JPEG', quality=quality)
    return 'data:image/jpeg;base64,' + base64.b64encode(buf.getvalue()).decode()

def process(raw_bytes):
    psd = PSDImage.open(io.BytesIO(bytes(raw_bytes)))
    W, H = psd.width, psd.height

    # Grupos de remera
    lShirt = find_nested(psd, 'Working Process', 'Left Shirt')
    rShirt = find_nested(psd, 'Working Process', 'Right Shirt')
    lMain  = find_nested(lShirt, 'Objects', 'Main Object')
    rMain  = find_nested(rShirt, 'Objects', 'Main Object')
    eF = find_layer(list(psd), 'Estampa Frontal')
    eB = find_layer(list(psd), 'Estampa Espalda')
    gL = find_layer(list(psd), 'Grifa Frente')

    def build(shirt_group, main, stamp):
        canvas = Image.new('RGBA', (W, H), (0, 0, 0, 0))
        # composite() del grupo = renderizado completo identico al PSD
        sg_img = shirt_group.composite()
        if sg_img:
            canvas.paste(sg_img.convert('RGBA'),
                         (shirt_group.bbox[0], shirt_group.bbox[1]),
                         sg_img.convert('RGBA'))
        # Agregar estampa encima
        if stamp:
            si = stamp.composite()
            if si:
                sa = np.array(si.convert('RGBA'))
                if (sa[:,:,3] > 10).sum() > 50:
                    canvas.paste(si.convert('RGBA'),
                                 (stamp.bbox[0], stamp.bbox[1]),
                                 si.convert('RGBA'))
        b = main.bbox
        return canvas.crop((b[0], b[1], b[2], b[3]))

    # Frente: borrar la grifa (se agrega en post-proceso)
    fc = build(lShirt, lMain, eF)
    if gL and lMain:
        gx = gL.left - lMain.left
        gy = gL.top  - lMain.top
        gw = gL.right  - gL.left
        gh = gL.bottom - gL.top
        # Rellenar con el color de la remera en esa zona
        sample = fc.getpixel((max(0, gx - 10), max(0, gy + gh//2)))
        fill = Image.new('RGBA', (gw + 8, gh + 8), (sample[0], sample[1], sample[2], 255))
        fc.paste(fill, (max(0, gx - 4), max(0, gy - 4)))

    bc = build(rShirt, rMain, eB)
    return to_jpeg_b64(fc), to_jpeg_b64(bc)
`;

async function processPSD(file) {
  const py = await loadPy();
  const buf = await file.arrayBuffer();
  py.globals.set('_b', py.toPy(new Uint8Array(buf)));
  await py.runPythonAsync(PY);
  const res = await py.runPythonAsync('process(_b)');
  const arr = res.toJs();
  return { front: arr[0], back: arr[1] };
}

// ── ag-psd quick preview ──────────────────────────────────────────
function findL(list, name) { return (list||[]).find(l=>l.name===name)||null; }
function findN(root, ...path) {
  let cur = root;
  for (const s of path) { cur = findL(cur.children, s); if(!cur) return null; }
  return cur;
}
function resize(src) {
  const w=src.width,h=src.height;
  if(w<=MAX_DIM&&h<=MAX_DIM) return src;
  const s=MAX_DIM/Math.max(w,h),c=document.createElement('canvas');
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c;
}
function quickPreview(buf) {
  const psd = agPsd.readPsd(buf, {skipLayerImageData:false,useRawThumbnail:false});
  const lM = findN(psd,'Working Process','Left Shirt','Objects','Main Object');
  const rM = findN(psd,'Working Process','Right Shirt','Objects','Main Object');
  if(!lM||!rM) throw new Error('No se encontraron Left/Right Shirt');

  function crop(mainObj) {
    if(!mainObj.canvas) return null;
    const c=document.createElement('canvas');
    const l=mainObj.left,t=mainObj.top,r=mainObj.right,b=mainObj.bottom;
    c.width=r-l;c.height=b-t;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#f5f5f5';ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(mainObj.canvas,0,0);
    return resize(c);
  }

  const fC=crop(lM), bC=crop(rM);
  return {
    front: fC ? fC.toDataURL('image/jpeg',.85) : null,
    back:  bC ? bC.toDataURL('image/jpeg',.85) : null,
  };
}

// ── Main file handler ─────────────────────────────────────────────
async function onFile(file) {
  if(!file) return;
  document.getElementById('gen-btn').disabled = true;
  frontDataUrl = null; backDataUrl = null;

  try {
    st('Leyendo PSD…');
    const buf = await file.arrayBuffer();

    // Preview rápido con ag-psd (puede ser incompleto, solo para ver)
    try {
      const prev = quickPreview(buf);
      if(prev.front) document.getElementById('preview-front').src = prev.front;
      if(prev.back)  document.getElementById('preview-back').src  = prev.back;
      document.getElementById('preview-row').style.display = 'flex';
    } catch(e) { console.warn('Preview error:', e); }

    // Procesamiento completo con Python (fiel al PSD)
    st('Procesando PSD con Python (20-40s la primera vez)…');
    const result = await processPSD(file);
    frontDataUrl = result.front;
    backDataUrl  = result.back;

    // Actualizar preview con el resultado correcto
    document.getElementById('preview-front').src = frontDataUrl;
    document.getElementById('preview-back').src  = backDataUrl;
    document.getElementById('preview-row').style.display = 'flex';
    document.getElementById('gen-btn').disabled = false;
    st('✓ PSD procesado — listo para generar');

  } catch(err) {
    console.error(err);
    st('Error: ' + err.message, true);
  }
}

// ── Post-proceso ─────────────────────────────────────────────────
function detectOff(d,w,h) {
  const avg=(x,y)=>{const i=(y*w+x)*4;return(d[i]+d[i+1]+d[i+2])/3;};
  const fondo=(avg(20,20)+avg(w-20,20))/2;
  const cs=[];
  for(let y=Math.floor(h*.45);y<Math.floor(h*.82);y+=15) {
    let l=-1,r=-1;
    for(let x=0;x<w;x++){const i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){l=x;break;}}
    for(let x=w-1;x>=0;x--){const i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){r=x;break;}}
    if(l>0&&r>0&&r-l>w*.25) cs.push((l+r)/2);
  }
  if(!cs.length) return 0;
  const s=cs.slice().sort((a,b)=>a-b);
  let o=Math.round(s[Math.floor(s.length/2)]-w/2);
  return Math.max(-180,Math.min(180,Math.abs(o)<15?0:o));
}
function center(canvas,ctx,off) {
  if(!off) return;
  const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;
  tmp.getContext('2d').drawImage(canvas,0,0);
  const bg=ctx.getImageData(20,20,1,1).data;
  ctx.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(tmp,-off,0);
}
function removeArt(id,y1,y2,x1,x2,rows=15) {
  const{data:d,width:w,height:h}=id;const above=[],below=[];
  for(let x=x1;x<x2;x++) {
    let r=0,g=0,b=0,n=0;
    for(let y=Math.max(0,y1-rows);y<y1;y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    above.push(n?[r/n,g/n,b/n]:[230,230,230]);
    r=g=b=n=0;
    for(let y=y2;y<Math.min(h,y2+rows);y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    below.push(n?[r/n,g/n,b/n]:[230,230,230]);
  }
  for(let row=0;row<y2-y1;row++) {
    const t=(y2-y1)>1?row/(y2-y1-1):0;
    for(let col=0;col<x2-x1;col++) {
      const i=((y1+row)*w+(x1+col))*4;
      d[i]  =Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1]=Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2]=Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return id;
}
async function postProcess(imgUrl, isFront) {
  return new Promise((resolve, reject) => {
    const img=new Image();img.crossOrigin='anonymous';
    img.onerror=()=>reject(new Error('No se pudo cargar imagen'));
    img.onload=()=>{
      const c=document.getElementById('work-canvas');
      c.width=img.width;c.height=img.height;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
      center(c,ctx,detectOff(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height));
      if(isFront) {
        let id=ctx.getImageData(0,0,c.width,c.height);
        id=removeArt(id,LABEL.y1,LABEL.y2,LABEL.x1,LABEL.x2);
        ctx.putImageData(id,0,0);
        const ci=ctx.getImageData(0,0,c.width,c.height);
        const cf=(ci.data[20*4]+ci.data[20*4+1]+ci.data[20*4+2])/3*.5
               +(ci.data[(20*c.width+(c.width-20))*4]+ci.data[(20*c.width+(c.width-20))*4+1]+ci.data[(20*c.width+(c.width-20))*4+2])/3*.5;
        const edges=[];
        for(let sy=Math.floor(c.height*.51);sy<Math.floor(c.height*.57);sy+=4)
          for(let sx=c.width-1;sx>=c.width/2;sx--) {
            const si=(sy*c.width+sx)*4;
            if(Math.abs((ci.data[si]+ci.data[si+1]+ci.data[si+2])/3-cf)>18){edges.push(sx);break;}
          }
        const se=edges.length?edges.slice().sort((a,b)=>a-b)[Math.floor(edges.length/2)]:c.width-80;
        const g=new Image();
        g.onload=()=>{ctx.drawImage(g,se-g.width,Math.floor(c.height*.555));resolve(c.toDataURL('image/jpeg',.95));};
        g.onerror=()=>resolve(c.toDataURL('image/jpeg',.95));
        g.src=GRIFA;
      } else {
        resolve(c.toDataURL('image/jpeg',.95));
      }
    };
    img.src=imgUrl;
  });
}

// ── API ──────────────────────────────────────────────────────────
async function apiPost(q,body) {
  const res=await fetch('/api/topview?'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await res.text();
  try{return JSON.parse(txt);}catch{throw new Error('HTTP '+res.status+': '+txt.slice(0,300));}
}
async function apiGet(q) {
  const res=await fetch('/api/topview?'+q);
  const txt=await res.text();
  try{return JSON.parse(txt);}catch{throw new Error('HTTP '+res.status+': '+txt.slice(0,300));}
}
async function upload(b64) {
  const d=await apiPost('upload=1',{imageBase64:b64});
  if(!d.ok) throw new Error('Upload: '+(d.error||JSON.stringify(d)));
  return d.fileId;
}
async function submit(p,t,m) {
  const d=await apiPost('submit=1',{productImageFileId:p,templateImageFileId:t,templateMaskFileId:m});
  if(!d.ok) throw new Error('Submit: '+(d.error||JSON.stringify(d)));
  return d.taskId;
}
async function poll(taskId, cb) {
  for(let i=0;i<40;i++) {
    await new Promise(r=>setTimeout(r,3000));
    let d;
    try{d=await apiGet('query='+encodeURIComponent(taskId));}
    catch(e){console.warn('poll',e);continue;}
    if(d.code!=='200') throw new Error('TopView: '+JSON.stringify(d).slice(0,300));
    const r=d.result||d, s=r.status||'?';
    if(cb) cb(s,i);
    console.log('Poll '+(i+1)+' status='+s);
    if(s==='success') {
      const url=(r.anyfitImages||[])[0]&&(r.anyfitImages||[])[0].url;
      if(!url) throw new Error('Sin URL: '+JSON.stringify(d).slice(0,200));
      return url;
    }
    if(s==='fail'||s==='failed') throw new Error('Tarea fallida: '+(r.errorMsg||'?'));
  }
  throw new Error('Timeout (2min). Intentá de nuevo.');
}
async function generate() {
  if(!frontDataUrl||!backDataUrl) return;
  const btn=document.getElementById('gen-btn');btn.disabled=true;
  document.getElementById('results').style.display='none';
  try {
    const b64=url=>url.split(',')[1];
    st('Subiendo frente…');const fId=await upload(b64(frontDataUrl));
    st('Subiendo espalda…');const bId=await upload(b64(backDataUrl));
    st('Creando tareas…');
    const fTask=(await Promise.all([submit(fId,TMPL_F,MASK_F),submit(bId,TMPL_B,MASK_B)]));
    st('Generando (30-60s)…');
    const urls=await Promise.all([
      poll(fTask[0],(s,i)=>st('Generando… '+(i*3)+'s — frente:'+s)),
      poll(fTask[1]),
    ]);
    st('Post-proceso…');
    const fp=await postProcess('/api/topview?proxy='+encodeURIComponent(urls[0]),true);
    const bp=await postProcess('/api/topview?proxy='+encodeURIComponent(urls[1]),false);
    document.getElementById('result-front').src=fp;
    document.getElementById('result-back').src=bp;
    document.getElementById('dl-front').href=fp;
    document.getElementById('dl-back').href=bp;
    document.getElementById('results').style.display='flex';
    st('✓ Listo');
  } catch(err) {
    console.error(err);st('Error: '+err.message,true);
  }
  btn.disabled=false;
}

document.getElementById('file-input').addEventListener('change',function(){onFile(this.files[0]);this.value='';});
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('active');});
dz.addEventListener('dragleave',()=>dz.classList.remove('active'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('active');onFile(e.dataTransfer.files[0]);});
</script>

  onerror="st('Error cargando ag-psd','err')"></script>
