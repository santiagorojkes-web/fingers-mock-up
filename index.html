<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fingers Crossed — Mockup Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--fg:#f0f0f0;--gray:#666;--accent:#c8ff00;--border:#222}
body{background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:40px 20px}
header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:40px}
.logo{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.subtitle{font-size:11px;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

.upload-area{max-width:640px;margin:0 auto 32px;border:1px dashed #2a2a2a;border-radius:4px;padding:48px;text-align:center}
.upload-area.active{border-color:var(--accent);background:rgba(200,255,0,.03)}
.upload-icon{font-size:32px;opacity:.3;margin-bottom:12px}
.upload-title{font-size:13px;color:var(--gray);margin-bottom:8px}
.upload-hint{font-size:11px;color:#404040}
.upload-btn{
  display:inline-block;margin-top:16px;padding:10px 28px;
  background:var(--accent);color:#000;border:none;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  cursor:pointer;border-radius:2px;
}
.upload-btn:hover{background:#d4ff33}
#file-input{display:none}

#preview-row{display:none;gap:16px;max-width:640px;margin:0 auto 28px}
.preview-box{flex:1}
.preview-img{aspect-ratio:3/4;background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview-img img{width:100%;height:100%;object-fit:contain}
.preview-lbl{font-size:10px;color:var(--gray);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}

.gen-btn{display:block;margin:0 auto 32px;background:var(--accent);color:#000;border:none;padding:14px 56px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px}
.gen-btn:disabled{opacity:.3;cursor:not-allowed}

#status{text-align:center;font-size:12px;color:var(--gray);min-height:20px;margin-bottom:32px;padding:0 20px}
#status.err{color:#ff5555}

#results{display:none;max-width:800px;margin:0 auto;gap:32px}
.result-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.result-card img{width:100%;display:block}
.result-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.result-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.dl-btn{background:transparent;border:1px solid var(--border);color:var(--fg);padding:6px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;transition:all .15s}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>

<header>
  <div class="logo">Fingers Crossed</div>
  <div class="subtitle">Mockup Generator</div>
</header>

<div class="upload-area" id="drop-zone">

  <div class="upload-hint">Se extraen frente y espalda automáticamente</div>
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">Seleccionar archivo</button>

</div>

<div id="preview-row" style="display:none;flex-direction:row;gap:16px;max-width:640px;margin:0 auto 28px">
  <div class="preview-box">
    <div class="preview-img"><img id="preview-front" src="" alt="Frente"></div>
    <div class="preview-lbl">Frente</div>
  </div>
  <div class="preview-box">

<button class="gen-btn" id="gen-btn" disabled onclick="generate()">Generar Mockup</button>
<div id="status"></div>

<div id="results" style="display:none;flex-direction:column;gap:32px;max-width:800px;margin:0 auto">

    <img id="result-front" src="" alt="Frente">

// ─── Status helpers ───────────────────────────────────────────────
function st(msg,err=false){
  const el=document.getElementById('status');

}

// ─── Resize canvas ────────────────────────────────────────────────
function resize(src){
  const w=src.width,h=src.height;
  if(w<=MAX_DIM&&h<=MAX_DIM) return src;
  const s=MAX_DIM/Math.max(w,h);
  const c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}

// ─── Blanquear remera gris → blanca ──────────────────────────────
function whiten(canvas){
  const ctx=canvas.getContext('2d');
  const id=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data;
  let mn=255,mx=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10&&d[i]>120&&d[i+1]>120&&d[i+2]>120){
      const v=(d[i]+d[i+1]+d[i+2])/3;
      if(v<mn)mn=v; if(v>mx)mx=v;
    }
  }
  if(mx<=mn) return;
  const range=mx-mn;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10&&d[i]>120&&d[i+1]>120&&d[i+2]>120){
      d[i]  =Math.min(255,Math.round(200+(d[i]  -mn)/range*55));
      d[i+1]=Math.min(255,Math.round(200+(d[i+1]-mn)/range*55));
      d[i+2]=Math.min(255,Math.round(200+(d[i+2]-mn)/range*55));
    }
  }
  ctx.putImageData(id,0,0);
}

// ─── PSD parsing ─────────────────────────────────────────────────
function findL(list,name){return(list||[]).find(l=>l.name===name)||null;}
function findN(root,...path){
  let cur=root;
  for(const s of path){cur=findL(cur.children,s);if(!cur)return null;}
  return cur;
}

function drawStamp(ctx,layer){
  if(!layer)return;
  if(layer.canvas)ctx.drawImage(layer.canvas,layer.left||0,layer.top||0);
  (layer.children||[]).forEach(c=>drawStamp(ctx,c));
}

function buildShirtCanvas(W,H,mainObj,stamp){
  const c=document.createElement('canvas');
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  if(mainObj?.canvas) ctx.drawImage(mainObj.canvas,mainObj.left||0,mainObj.top||0);
  drawStamp(ctx,stamp);
  const crop=document.createElement('canvas');
  const {left:l=0,top:t=0,right:r=W,bottom:b=H}=mainObj||{};
  crop.width=r-l; crop.height=b-t;
  crop.getContext('2d').drawImage(c,-l,-t);
  whiten(crop);
  return resize(crop);
}

async function readPSD(file){
  st('Leyendo PSD…');
  const buf=await file.arrayBuffer();
  const psd=agPsd.readPsd(buf,{skipLayerImageData:false,useRawThumbnail:false,useImageData:false});
  const W=psd.width, H=psd.height;
  const lMain =findN(psd,'Working Process','Left Shirt','Objects','Main Object');
  const rMain =findN(psd,'Working Process','Right Shirt','Objects','Main Object');
  const eFront=findL(psd.children,'Estampa Frontal');
  const eBack =findL(psd.children,'Estampa Espalda');
  if(!lMain||!rMain) throw new Error('No se encontraron layers Left/Right Shirt');
  const fC=buildShirtCanvas(W,H,lMain,eFront);
  const bC=buildShirtCanvas(W,H,rMain,eBack);
  const kb=c=>Math.round(c.toDataURL('image/jpeg',.92).length*.75/1024);
  st(`✓ PSD leído — frente ~${kb(fC)}KB · espalda ~${kb(bC)}KB`);
  return {
    front: fC.toDataURL('image/jpeg',.92),
    back:  bC.toDataURL('image/jpeg',.92),
  };
}

// ─── Centering ───────────────────────────────────────────────────
function detectOff(d,w,h){
  // Fondo: promedio de cuatro esquinas
  const avg=(x,y)=>{const i=(y*w+x)*4;return(d[i]+d[i+1]+d[i+2])/3;};
  const fondo=(avg(20,20)+avg(w-20,20)+avg(20,h-20)+avg(w-20,h-20))/4;
  const centers=[];
  for(let y=Math.floor(h*.45);y<Math.floor(h*.82);y+=15){
    let l=-1,r=-1;
    for(let x=0;x<w;x++){const i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){l=x;break;}}
    for(let x=w-1;x>=0;x--){const i=(y*w+x)*4;if(Math.abs((d[i]+d[i+1]+d[i+2])/3-fondo)>18){r=x;break;}}
    if(l>0&&r>0&&r-l>w*.25) centers.push((l+r)/2);
  }
  if(!centers.length) return 0;
  const sorted=centers.slice().sort((a,b)=>a-b);
  const med=sorted[Math.floor(sorted.length/2)];
  console.log('offset detected:',Math.round(med-w/2),'px  (centers sample:',sorted.slice(0,5).map(v=>Math.round(v)).join(','),')');
  return Math.round(med-w/2);
}

function center(canvas,ctx,off){
  if(Math.abs(off)<8) return;
  const tmp=document.createElement('canvas');
  tmp.width=canvas.width; tmp.height=canvas.height;
  tmp.getContext('2d').drawImage(canvas,0,0);
  // fill background
  const bg=ctx.getImageData(20,20,1,1).data;
  ctx.fillStyle=`rgb(${bg[0]},${bg[1]},${bg[2]})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(tmp,-off,0);
}

// ─── Remove artifact (interpolate above/below) ───────────────────
function removeArt(id,y1,y2,x1,x2,rows=15){
  const {data:d,width:w,height:h}=id;
  const above=[],below=[];
  for(let x=x1;x<x2;x++){
    let r=0,g=0,b=0,n=0;
    for(let y=Math.max(0,y1-rows);y<y1;y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    above.push(n?[r/n,g/n,b/n]:[230,230,230]);
    r=g=b=n=0;
    for(let y=y2;y<Math.min(h,y2+rows);y++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    below.push(n?[r/n,g/n,b/n]:[230,230,230]);
  }
  const rh=y2-y1;
  for(let row=0;row<rh;row++){
    const t=rh>1?row/(rh-1):0;
    for(let col=0;col<x2-x1;col++){
      const i=((y1+row)*w+(x1+col))*4;
      d[i]  =Math.round(above[col][0]*(1-t)+below[col][0]*t);
      d[i+1]=Math.round(above[col][1]*(1-t)+below[col][1]*t);
      d[i+2]=Math.round(above[col][2]*(1-t)+below[col][2]*t);
    }
  }
  return id;
}

// ─── Post-process ────────────────────────────────────────────────
async function postProcess(imgUrl,isFront){
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onerror=()=>reject(new Error('No se pudo cargar imagen resultado'));
    img.onload=()=>{
      const c=document.getElementById('work-canvas');
      c.width=img.width; c.height=img.height;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,0,0);

      // 1. Centrar
      const raw=ctx.getImageData(0,0,c.width,c.height);
      const off=detectOff(raw.data,c.width,c.height);
      center(c,ctx,off);

      if(isFront){
        // 2. Remover etiqueta interna
        let id=ctx.getImageData(0,0,c.width,c.height);
        id=removeArt(id,LABEL.y1,LABEL.y2,LABEL.x1,LABEL.x2);
        ctx.putImageData(id,0,0);
        // 3. Agregar grifa (manga derecha)
        const g=new Image();
        g.onload=()=>{
          ctx.drawImage(g,GRF.x,GRF.y);
          resolve(c.toDataURL('image/jpeg',.95));
        };
        g.onerror=()=>resolve(c.toDataURL('image/jpeg',.95)); // continuar sin grifa si falla
        g.src=GRIFA;
      } else {
        resolve(c.toDataURL('image/jpeg',.95));
      }
    };
    img.src=imgUrl;
  });
}

// ─── API calls ────────────────────────────────────────────────────
async function apiPost(q,body){
  const res=await fetch(`/api/topview?${q}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await res.text();
  try{return JSON.parse(txt);}catch{throw new Error(`HTTP ${res.status}: ${txt.slice(0,200)}`);}
}
async function apiGet(q){
  const res=await fetch(`/api/topview?${q}`);
  const txt=await res.text();
  try{return JSON.parse(txt);}catch{throw new Error(`HTTP ${res.status}: ${txt.slice(0,200)}`);}
}

async function upload(b64){
  const d=await apiPost('upload=1',{imageBase64:b64});
  if(!d.ok) throw new Error('Upload: '+(d.error||JSON.stringify(d)));
  return d.fileId;
}
async function submit(productFileId,tmplId,maskId){
  const d=await apiPost('submit=1',{productImageFileId:productFileId,templateImageFileId:tmplId,templateMaskFileId:maskId});
  if(!d.ok) throw new Error('Submit: '+(d.error||JSON.stringify(d)));
  return d.taskId;
}
async function poll(taskId,cb){
  for(let i=0;i<80;i++){
    await new Promise(r=>setTimeout(r,3000));
    const d=await apiGet(`query=${encodeURIComponent(taskId)}`);
    if(d.code!=='200') throw new Error('Query: '+JSON.stringify(d));
    const r=d.result||d;
    if(cb) cb(r.status||'?',i);
    if(r.status==='success'){
      const url=(r.anyfitImages||[])[0]?.url;
      if(!url) throw new Error('Sin URL en resultado: '+JSON.stringify(d));
      return url;
    }
    if(r.status==='fail'||r.status==='failed') throw new Error('Fallida: '+(r.errorMsg||'?'));
  }
  throw new Error('Timeout');
}

// ─── Generate ─────────────────────────────────────────────────────
async function generate(){
  if(!frontDataUrl||!backDataUrl) return;
  const btn=document.getElementById('gen-btn');
  btn.disabled=true;
  document.getElementById('results').style.display='none';
  try{
    const b64=url=>url.split(',')[1];

    st('Subiendo frente…');
    const fId=await upload(b64(frontDataUrl));

    st('Subiendo espalda…');
    const bId=await upload(b64(backDataUrl));

    st('Creando tareas…');
    const [fTask,bTask]=await Promise.all([submit(fId,TMPL_F,MASK_F),submit(bId,TMPL_B,MASK_B)]);

    st('Generando (30–60s)…');
    const [fUrl,bUrl]=await Promise.all([
      poll(fTask,(s,i)=>st(`Generando… ${i*3}s — frente:${s}`)),
      poll(bTask),
    ]);

    st('Post-proceso…');
    const [fp,bp]=await Promise.all([
      postProcess(`/api/topview?proxy=${encodeURIComponent(fUrl)}`,true),
      postProcess(`/api/topview?proxy=${encodeURIComponent(bUrl)}`,false),
    ]);

    document.getElementById('result-front').src=fp;
    document.getElementById('result-back').src=bp;
    document.getElementById('dl-front').href=fp;
    document.getElementById('dl-back').href=bp;
    document.getElementById('results').style.display='flex';
    st('✓ Listo');
  }catch(err){
    console.error(err);
    st('Error: '+err.message,true);
  }
  btn.disabled=false;
}

// ─── File input ───────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change',async function(){
  const file=this.files[0];
  if(!file)return;
  document.getElementById('gen-btn').disabled=true;
  try{
    const {front,back}=await readPSD(file);
    frontDataUrl=front; backDataUrl=back;
    document.getElementById('preview-front').src=front;
    document.getElementById('preview-back').src=back;
    document.getElementById('preview-row').style.display='flex';
    document.getElementById('gen-btn').disabled=false;
  }catch(err){
    console.error(err);
    st('Error al leer PSD: '+err.message,true);
  }
  this.value=''; // reset para poder subir el mismo archivo de nuevo
});

// ─── Drag & drop ──────────────────────────────────────────────────
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('active');});
dz.addEventListener('dragleave',()=>dz.classList.remove('active'));
dz.addEventListener('drop',async e=>{
  e.preventDefault(); dz.classList.remove('active');
  const f=e.dataTransfer.files[0];
  if(!f)return;
  document.getElementById('gen-btn').disabled=true;
  try{
    const {front,back}=await readPSD(f);
    frontDataUrl=front; backDataUrl=back;
    document.getElementById('preview-front').src=front;
    document.getElementById('preview-back').src=back;
    document.getElementById('preview-row').style.display='flex';
    document.getElementById('gen-btn').disabled=false;
  }catch(err){
    console.error(err);
    st('Error al leer PSD: '+err.message,true);
  }
});
</script>
